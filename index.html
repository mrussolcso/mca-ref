<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relational Law Directory</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
  }
  
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
  .container { max-width: 950px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  
  .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 16px 20px; border-radius: 8px; }
  .header-bar h2 { margin: 0; font-size: 1.25rem; }
  .btn-admin { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
  .btn-admin:hover { background: rgba(255, 255, 255, 0.35); }

  .card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  
  .search-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; margin-bottom: 15px; }
  .law-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .law-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .law-item:last-child { border-bottom: none; }
  .law-item:hover { background: #edf2f7; }
  .law-item.active { background: #ebf8ff; font-weight: bold; border-left: 4px solid var(--primary-light); }

  /* Detail Pane Layout */
  .detail-pane { display: flex; flex-direction: column; justify-content: space-between; min-height: 350px; }
  .detail-header { border-bottom: 2px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; }
  .badge-source { background: var(--primary-light); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
  .btn-official { background: var(--primary-light); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; }
  .btn-official:hover { opacity: 0.9; }

  .detail-body { flex-grow: 1; line-height: 1.6; margin-bottom: 20px; }
  .tree-node-view { margin-bottom: 8px; }

  /* Bottom Metadata Section */
  .detail-footer { border-top: 1px solid var(--border); padding-top: 14px; font-size: 0.82rem; color: #718096; background: #f8fafc; border-radius: 6px; padding: 12px; margin-top: 15px; }
  .empty-msg { color: #a0aec0; text-align: center; padding: 30px; font-style: italic; }
</style>
</head>
<body>

<div class="container">
  
  <header class="header-bar">
    <h2>📖 Relational Law Directory</h2>
    <a href="admin.html" class="btn-admin">⚙️ Admin Publisher</a>
  </header>

  <!-- Directory Search and Select -->
  <div class="card">
    <h3 style="margin-top:0;">Select Law</h3>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search laws by title or ID..." oninput="filterLaws()">
    <ul class="law-list" id="lawListContainer">
      <li class="empty-msg">Loading laws directory...</li>
    </ul>
  </div>

  <!-- Detail Pane -->
  <div class="card detail-pane" id="lawDetailCard">
    <div id="detailPlaceholder" class="empty-msg">
      Select a law from the list above to view its contents.
    </div>

    <div id="detailContent" style="display: none; height: 100%; flex-direction: column; justify-content: space-between;">
      
      <!-- Top Section: Type, Title, ID & Official Link -->
      <div>
        <header class="detail-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
            <div>
              <span class="badge-source" id="view_source_type">MCA Statute</span>
              <h2 id="view_law_title" style="margin: 8px 0 4px 0; color: var(--primary);">--</h2>
              <div style="font-size: 0.9rem; color: #4a5568;" id="view_law_id"><strong>ID:</strong> --</div>
            </div>
            
            <div id="view_official_url_container">
              <a id="view_official_url" href="#" target="_blank" rel="noopener noreferrer" class="btn-official">
                🔗 Official Publication
              </a>
            </div>
          </div>
        </header>

        <!-- Main Body Content -->
        <main class="detail-body" id="view_law_content">
          <!-- Text content populates here -->
        </main>
      </div>

      <!-- Bottom History and Metadata Footer -->
      <footer class="detail-footer">
        <h4 style="margin: 0 0 6px 0; color: var(--primary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
          📜 History & Metadata
        </h4>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
          <div>
            <strong>Revision History:</strong>
            <div id="view_law_history" style="margin-top: 2px; color: #4a5568;">--</div>
          </div>
          <div>
            <strong>Database Tracking:</strong>
            <div id="view_last_updated" style="margin-top: 2px; color: #4a5568;">--</div>
          </div>
        </div>
      </footer>

    </div>
  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let allLaws = [];
let currentSelectedId = null;

window.addEventListener('DOMContentLoaded', loadIndex);

async function loadIndex() {
  const container = document.getElementById('lawListContainer');
  const url = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch index.');

    allLaws = await res.json();
    renderList(allLaws);
  } catch (err) {
    container.innerHTML = `<li class="empty-msg" style="color:#e53e3e;">Failed to load laws index.</li>`;
  }
}

function renderList(laws) {
  const container = document.getElementById('lawListContainer');
  container.innerHTML = '';

  if (laws.length === 0) {
    container.innerHTML = `<li class="empty-msg">No laws found.</li>`;
    return;
  }

  laws.forEach(law => {
    const li = document.createElement('li');
    li.className = `law-item ${law.id === currentSelectedId ? 'active' : ''}`;
    li.onclick = () => selectLaw(law.id, li);

    li.innerHTML = `
      <span>${law.title || 'Untitled Record'}</span>
      <span style="font-size: 0.8rem; color: #718096;">${law.id}</span>
    `;

    container.appendChild(li);
  });
}

function filterLaws() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allLaws.filter(l => 
    (l.title && l.title.toLowerCase().includes(q)) || 
    (l.id && l.id.toLowerCase().includes(q))
  );
  renderList(filtered);
}

async function selectLaw(lawId, element) {
  currentSelectedId = lawId;

  document.querySelectorAll('.law-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');

  const placeholder = document.getElementById('detailPlaceholder');
  const content = document.getElementById('detailContent');

  placeholder.style.display = 'block';
  placeholder.textContent = 'Loading details...';
  content.style.display = 'none';

  const fileUrl = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`;

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('Law record not found.');

    const lawData = await res.json();
    renderDetail(lawData);

    placeholder.style.display = 'none';
    content.style.display = 'flex';
  } catch (err) {
    placeholder.textContent = `Error loading details: ${err.message}`;
  }
}

function renderDetail(lawData) {
  // Top Header Elements
  document.getElementById('view_source_type').textContent = lawData.source_type || 'MCA Statute';
  document.getElementById('view_law_title').textContent = lawData.title || 'Untitled Record';
  document.getElementById('view_law_id').innerHTML = `<strong>ID:</strong> ${lawData.law_id || lawData.id}`;

  const urlBtnContainer = document.getElementById('view_official_url_container');
  const urlLink = document.getElementById('view_official_url');

  if (lawData.official_url && lawData.official_url.trim() !== '') {
    urlLink.href = lawData.official_url;
    urlBtnContainer.style.display = 'block';
  } else {
    urlBtnContainer.style.display = 'none';
  }

  // Main Content Body
  const contentContainer = document.getElementById('view_law_content');
  if (lawData.tree && lawData.tree.length > 0) {
    contentContainer.innerHTML = renderTreeToHTML(lawData.tree);
  } else if (lawData.paragraphs && lawData.paragraphs.length > 0) {
    contentContainer.innerHTML = renderParagraphsToHTML(lawData.paragraphs);
  } else {
    contentContainer.innerHTML = '<p style="color: #a0aec0; font-style: italic;">No text content recorded.</p>';
  }

  // Bottom Footer History Elements
  document.getElementById('view_law_history').textContent = lawData.history || 'No revision notes.';

  if (lawData.last_updated) {
    const updatedDate = new Date(lawData.last_updated).toLocaleDateString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
    document.getElementById('view_last_updated').textContent = `Last Updated: ${updatedDate}`;
  } else {
    document.getElementById('view_last_updated').textContent = 'Last Updated: Unknown';
  }
}

function renderTreeToHTML(nodes, level = 0) {
  let html = '<div>';
  nodes.forEach(node => {
    const indent = level * 16;
    html += `
      <div class="tree-node-view" style="margin-left: ${indent}px;">
        <strong>${node.counter || ''}</strong> ${node.text || ''}
        ${node.children && node.children.length > 0 ? renderTreeToHTML(node.children, level + 1) : ''}
      </div>
    `;
  });
  html += '</div>';
  return html;
}

function renderParagraphsToHTML(paragraphs) {
  return paragraphs.map(p => `
    <div style="margin-bottom: 8px; margin-left: ${(p.indent || 1) * 12}px;">
      <strong>${p.counter || ''}</strong> ${p.text || ''}
    </div>
  `).join('');
}
</script>

</body>
</html>
