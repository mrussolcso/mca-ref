<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Code & Bond Book Reference</title>
<style>
  :root {
    --primary: #1a365d;
    --primary-light: #2b6cb0;
    --border: #e2e8f0;
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text: #2d3748;
    --text-muted: #718096;
    --badge-misd: #2b6cb0;
    --badge-felony: #c53030;
    --badge-civil: #dd6b20;
    --highlight-bg: #fefcbf;
    --highlight-border: #d69e2e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg-main); overflow: hidden; }

  /* 3-Pane App Layout */
  .app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

  /* Pane 1: Search & Index Sidebar */
  .sidebar-nav { width: 340px; min-width: 300px; background: #ffffff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .nav-header { padding: 14px 16px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
  .nav-header h1 { margin: 0; font-size: 1.1rem; }
  .admin-link { color: #bee3f8; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,0.15); }

  .index-toggle { display: flex; border-bottom: 1px solid var(--border); background: #edf2f7; }
  .toggle-btn { flex: 1; padding: 10px 0; border: none; background: none; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; text-align: center; }
  .toggle-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary-light); }

  .search-container { padding: 12px; border-bottom: 1px solid var(--border); background: #f7fafc; }
  .search-container input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }

  .index-list { flex: 1; overflow-y: auto; }
  .index-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .index-item:hover { background: #f7fafc; }
  .index-item.active { background: #ebf8ff; border-left: 4px solid var(--primary-light); }
  .index-item h4 { margin: 0 0 4px 0; font-size: 0.9rem; color: var(--primary); }
  .index-item p { margin: 0; font-size: 0.78rem; color: var(--text-muted); }

  /* Pane 2: Primary Content Reader */
  .main-reader { flex: 1; height: 100%; overflow-y: auto; padding: 28px 36px; background: #ffffff; }
  .reader-header { padding-bottom: 16px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .meta-bar { display: flex; gap: 16px; font-size: 0.82rem; color: var(--text-muted); margin-top: 8px; flex-wrap: wrap; }
  .meta-bar a { color: var(--primary-light); text-decoration: none; font-weight: 600; }

  /* Offense Card Grid */
  .offense-card { border: 1px solid var(--border); border-radius: 8px; padding: 20px; background: #f8fafc; margin-bottom: 20px; }
  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
  .data-point { background: white; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); }
  .data-point label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
  .data-point span { font-size: 1rem; font-weight: 600; color: var(--primary); }

  /* Pane 3: Dynamic Reference Sidebar */
  .reference-sidebar { width: 360px; min-width: 320px; background: #f7fafc; border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; flex-shrink: 0; }
  .ref-title { font-size: 0.95rem; color: var(--primary); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 0; }

  /* Text & Highlighting */
  .p-item { margin-bottom: 8px; line-height: 1.5; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; }
  .indent-1 { margin-left: 0; }
  .indent-2 { margin-left: 20px; }
  .indent-3 { margin-left: 40px; }
  .p-item.highlighted { background-color: var(--highlight-bg) !important; border-left: 4px solid var(--highlight-border) !important; font-weight: 600; }

  .badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; color: white; text-transform: uppercase; }
  .badge-misdemeanor { background: var(--badge-misd); }
  .badge-felony { background: var(--badge-felony); }
  .badge-civil { background: var(--badge-civil); }
  .empty-msg { text-align: center; color: var(--text-muted); margin-top: 40px; }
</style>
</head>
<body>

<div class="app-layout">

  <!-- Pane 1: Navigation Sidebar -->
  <aside class="sidebar-nav">
    <header class="nav-header">
      <h1>Legal Reference</h1>
      <a href="admin.html" class="admin-link">⚙️ Admin</a>
    </header>

    <div class="index-toggle">
      <button class="toggle-btn active" id="btnTabLaws" onclick="switchTab('laws')">📜 Laws & Codes</button>
      <button class="toggle-btn" id="btnTabOffenses" onclick="switchTab('offenses')">🚨 Offenses Index</button>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search laws or offenses..." oninput="filterIndex()">
    </div>

    <div class="index-list" id="indexList"></div>
  </aside>

  <!-- Pane 2: Primary Reader -->
  <main class="main-reader" id="mainReader">
    <div class="empty-msg" id="emptyState">Select a law or offense from the left sidebar to view details.</div>
    <div id="readerContent" style="display: none;"></div>
  </main>

  <!-- Pane 3: Reference Drawer -->
  <aside class="reference-sidebar" id="referenceSidebar">
    <h3 class="ref-title" id="refTitle">Linked Context</h3>
    <div id="refContent"><p style="color:var(--text-muted); font-size:0.85rem;">Select an item to display cross-references.</p></div>
  </aside>

</div>

<script>
let activeTab = 'laws';
let lawsIndex = [];
let offensesIndex = [];
let activeId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await loadIndexes();
});

async function loadIndexes() {
  const ts = new Date().getTime();
  try {
    const [resLaws, resOff] = await Promise.all([
      fetch(`data/laws-index.json?t=${ts}`).catch(() => null),
      fetch(`data/offenses-index.json?t=${ts}`).catch(() => null)
    ]);

    lawsIndex = resLaws && resLaws.ok ? await resLaws.json() : [];
    offensesIndex = resOff && resOff.ok ? await resOff.json() : [];
    
    renderIndex();
  } catch (err) {
    console.error("Index loading error:", err);
  }
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('btnTabLaws').classList.toggle('active', tab === 'laws');
  document.getElementById('btnTabOffenses').classList.toggle('active', tab === 'offenses');
  renderIndex();
}

function filterIndex() {
  renderIndex();
}

function renderIndex() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('indexList');
  const dataset = activeTab === 'laws' ? lawsIndex : offensesIndex;

  const filtered = dataset.filter(item => {
    return !q || item.id.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || (item.keywords && item.keywords.toLowerCase().includes(q));
  });

  if (filtered.length === 0) {
    container.innerHTML = `<p style="padding:15px; color:var(--text-muted); font-size:0.85rem;">No matching ${activeTab} found.</p>`;
    return;
  }

  container.innerHTML = filtered.map(item => `
    <div class="index-item ${item.id === activeId ? 'active' : ''}" onclick="selectItem('${item.id}')">
      <h4>${item.id}</h4>
      <p>${item.title}</p>
      ${item.degree ? `<span class="badge badge-${item.degree.toLowerCase()}" style="margin-top:4px; display:inline-block;">${item.degree}</span>` : ''}
    </div>
  `).join('');
}

async function selectItem(id) {
  activeId = id;
  renderIndex();
  document.getElementById('emptyState').style.display = 'none';
  const reader = document.getElementById('readerContent');
  reader.style.display = 'block';

  if (activeTab === 'laws') {
    await loadLawView(id);
  } else {
    await loadOffenseView(id);
  }
}

async function loadLawView(lawId) {
  const reader = document.getElementById('readerContent');
  const refContent = document.getElementById('refContent');
  document.getElementById('refTitle').textContent = 'Linked Offenses';

  try {
    const res = await fetch(`data/laws/${lawId}.json`);
    const law = await res.json();

    reader.innerHTML = `
      <div class="reader-header">
        <h2>${law.law_id}: ${law.title}</h2>
        <div class="meta-bar">
          <span>Type: <strong>${law.source_type || 'MCA Statute'}</strong></span>
          ${law.official_url ? `<a href="${law.official_url}" target="_blank">🌐 Official Publication</a>` : ''}
          ${law.last_updated ? `<span>Updated: ${new Date(law.last_updated).toLocaleDateString()}</span>` : ''}
        </div>
      </div>
      <h3>Law Text</h3>
      ${renderParagraphs(law.paragraphs)}
      ${law.history ? `<div style="margin-top:20px; font-size:0.82rem; color:var(--text-muted);"><strong>History:</strong> ${law.history}</div>` : ''}
    `;

    // Fetch linked offenses for sidebar
    const linkedOffenses = offensesIndex.filter(o => o.law_id === lawId);
    if (linkedOffenses.length > 0) {
      refContent.innerHTML = linkedOffenses.map(o => `
        <div class="offense-card" style="padding:12px; cursor:pointer;" onclick="switchTab('offenses'); selectItem('${o.id}');">
          <strong>${o.title}</strong>
          <div style="margin-top:4px;"><span class="badge badge-${(o.degree||'').toLowerCase()}">${o.degree}</span></div>
        </div>
      `).join('');
    } else {
      refContent.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">No linked offenses registered for this law.</p>`;
    }

  } catch (err) {
    reader.innerHTML = `<p style="color:red;">Error loading law data: ${err.message}</p>`;
  }
}

async function loadOffenseView(offenseId) {
  const reader = document.getElementById('readerContent');
  const refContent = document.getElementById('refContent');
  document.getElementById('refTitle').textContent = 'Parent Law Text';

  try {
    const res = await fetch(`data/offenses/${offenseId}.json`);
    const off = await res.json();

    reader.innerHTML = `
      <div class="reader-header">
        <h2>${off.charge_title}</h2>
        <div><span class="badge badge-${(off.degree || 'misdemeanor').toLowerCase()}">${off.degree}</span></div>
      </div>

      <div class="offense-card">
        <h3>Bond & Offense Schedule</h3>
        <div class="card-grid">
          <div class="data-point"><label>Citation</label><span>${off.law_id}${off.subsection_ref || ''}</span></div>
          <div class="data-point"><label>Recommended Bond</label><span>${off.rec_bond || '-'}</span></div>
          <div class="data-point"><label>Min Fine / Max Fine</label><span>${off.min_fine || '$0'} / ${off.max_fine || '-'}</span></div>
          <div class="data-point"><label>Jail Range</label><span>${off.min_jail || 'None'} - ${off.max_jail || 'None'}</span></div>
          <div class="data-point"><label>Surcharges</label><span>${off.surcharges || 'Standard'}</span></div>
          <div class="data-point"><label>Must Appear</label><span>${off.must_appear || 'REQUIRED'}</span></div>
        </div>
      </div>
    `;

    // Fetch Parent Law for Context Sidebar
    if (off.law_id) {
      const resLaw = await fetch(`data/laws/${off.law_id}.json`);
      if (resLaw.ok) {
        const law = await resLaw.json();
        refContent.innerHTML = `
          <p style="font-size:0.85rem;"><strong>${law.law_id}: ${law.title}</strong></p>
          ${renderParagraphs(law.paragraphs, off.subsection_ref)}
        `;
      }
    }

  } catch (err) {
    reader.innerHTML = `<p style="color:red;">Error loading offense data: ${err.message}</p>`;
  }
}

function renderParagraphs(paragraphs, targetRef = '') {
  if (!paragraphs) return '';
  const cleanTarget = (targetRef || '').replace(/\s+/g, '').toLowerCase();

  return paragraphs.map(p => {
    const counter = (p.counter || '').replace(/\s+/g, '').toLowerCase();
    const isTarget = cleanTarget && counter && (counter === cleanTarget || cleanTarget.startsWith(counter));
    const indent = p.counter && /^\([a-z]\)/.test(p.counter) ? 'indent-2' : 'indent-1';

    return `<div class="p-item ${indent} ${isTarget ? 'highlighted' : ''}"><strong>${p.counter || ''}</strong> ${p.text}</div>`;
  }).join('');
}
</script>

</body>
</html>
