<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Relational Law Directory</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
    --card-bg: #ffffff;
    --text: #2d3748;
  }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    margin: 0; 
    padding: 20px; 
  }

  .container { 
    max-width: 1400px; 
    margin: 0 auto; 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
  }

  .app-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: var(--primary); 
    color: white; 
    padding: 16px 20px; 
    border-radius: 8px; 
  }

  .app-header h1 { margin: 0; font-size: 1.3rem; }

  .btn-nav { 
    background: rgba(255, 255, 255, 0.2); 
    color: white; 
    text-decoration: none; 
    padding: 8px 14px; 
    border-radius: 6px; 
    font-weight: 600; 
    font-size: 0.9rem; 
  }

  .btn-nav:hover { background: rgba(255, 255, 255, 0.35); }

  .two-column-layout { 
    display: grid; 
    grid-template-columns: 320px 1fr; 
    gap: 20px; 
    align-items: start;
  }

  @media (max-width: 900px) {
    .two-column-layout { grid-template-columns: 1fr; }
  }

  .card { 
    background: var(--card-bg); 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    padding: 20px; 
  }

  .search-box { 
    width: 100%; 
    padding: 10px; 
    font-size: 0.9rem; 
    border: 1px solid var(--border); 
    border-radius: 6px; 
    box-sizing: border-box; 
    margin-bottom: 12px;
  }

  .law-list { 
    list-style: none; 
    padding: 0; 
    margin: 0; 
    max-height: 650px; 
    overflow-y: auto; 
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .law-item { 
    padding: 10px 12px; 
    border-bottom: 1px solid var(--border); 
    cursor: pointer; 
    transition: background 0.15s; 
  }

  .law-item:last-child { border-bottom: none; }
  .law-item:hover { background: #edf2f7; }

  .law-item.active { 
    background: #ebf8ff; 
    border-left: 4px solid var(--primary-light); 
  }

  .law-item-title { font-weight: 600; font-size: 0.88rem; color: var(--primary); }
  .law-item-id { font-size: 0.78rem; color: #718096; margin-top: 2px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: var(--primary); }
  .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
  textarea.form-control { resize: vertical; min-height: 80px; }

  .btn-submit {
    background: var(--primary-light);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }

  .btn-submit:hover { background: var(--primary); }

  .empty-msg { text-align: center; color: #a0aec0; padding: 30px 10px; font-style: italic; font-size: 0.9rem; }
  
  .status-alert { padding: 12px; border-radius: 6px; font-size: 0.88rem; display: none; margin-top: 10px; }
  .status-alert.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
  .status-alert.error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
</style>
</head>
<body>

<div class="container">
  
  <header class="app-header">
    <h1>⚙️ Law Directory Admin Publisher</h1>
    <a href="index.html" class="btn-nav">📖 Return to Directory</a>
  </header>

  <div class="two-column-layout">
    
    <!-- LEFT COLUMN: Selector -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin:0; font-size:1rem; color:var(--primary);">Select to Edit</h3>
        <button type="button" onclick="createNewRecord()" style="background:#e2e8f0; border:none; padding:4px 8px; border-radius:4px; font-weight:600; cursor:pointer;">+ New Law</button>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search laws..." oninput="filterLaws()">
      <ul class="law-list" id="lawListContainer">
        <li class="empty-msg">Loading laws...</li>
      </ul>
    </div>

    <!-- RIGHT COLUMN: Editor Form Pane -->
    <div class="card">
      <h3 style="margin-top:0; color:var(--primary);" id="formTitle">Edit Law Entry</h3>
      
      <!-- PAT Token Field with Toggle Eye -->
      <div class="form-group">
        <label for="patToken">GitHub Personal Access Token (PAT):</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input 
            type="password" 
            id="patToken" 
            class="form-control" 
            placeholder="ghp_..." 
            style="padding-right: 40px;"
          >
          <button 
            type="button" 
            id="togglePatVisibility" 
            onclick="togglePatTokenView()" 
            title="Toggle Visibility"
            style="
              position: absolute; 
              right: 8px; 
              background: transparent; 
              border: none; 
              cursor: pointer; 
              font-size: 1.1rem; 
              padding: 4px;
              line-height: 1;
              color: #718096;
            "
          >
            👁️
          </button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label for="law_id">Law ID / Section:</label>
          <input type="text" id="law_id" class="form-control" placeholder="e.g., 45-5-206">
        </div>

        <div class="form-group">
          <label for="source_type">Source Type:</label>
          <input type="text" id="source_type" class="form-control" value="MCA Statute">
        </div>
      </div>

      <div class="form-group">
        <label for="title">Title / Name:</label>
        <input type="text" id="title" class="form-control" placeholder="e.g., Partner or Family Member Assault">
      </div>

      <div class="form-group">
        <label for="official_url">Official URL:</label>
        <input type="url" id="official_url" class="form-control" placeholder="https://leg.mt.gov/...">
      </div>

      <div class="form-group">
        <label for="history">Revision History:</label>
        <textarea id="history" class="form-control" rows="3" placeholder="En. Sec. 1, Ch. 700, L. 1985..."></textarea>
      </div>

      <div class="form-group">
        <label for="json_content">Raw Content Structure (JSON Tree / Paragraphs):</label>
        <textarea id="json_content" class="form-control" rows="10" style="font-family: monospace; font-size: 0.85rem;" placeholder="[]"></textarea>
      </div>

      <button type="button" class="btn-submit" onclick="publishRecord()">🚀 Save & Commit to GitHub</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>

  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let allLaws = [];
let currentSelectedId = null;

window.addEventListener('DOMContentLoaded', loadIndex);

function togglePatTokenView() {
  const tokenInput = document.getElementById('patToken');
  const toggleBtn = document.getElementById('togglePatVisibility');

  if (tokenInput.type === 'password') {
    tokenInput.type = 'text';
    toggleBtn.textContent = '🙈';
  } else {
    tokenInput.type = 'password';
    toggleBtn.textContent = '👁️';
  }
}

async function loadIndex() {
  const container = document.getElementById('lawListContainer');
  const url = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch index.');

    allLaws = await res.json();
    renderList(allLaws);
  } catch (err) {
    container.innerHTML = `<li class="empty-msg" style="color:#e53e3e;">Failed to load laws index.</li>`;
  }
}

function renderList(laws) {
  const container = document.getElementById('lawListContainer');
  container.innerHTML = '';

  if (laws.length === 0) {
    container.innerHTML = `<li class="empty-msg">No matching laws found.</li>`;
    return;
  }

  laws.forEach(law => {
    const li = document.createElement('li');
    li.className = `law-item ${law.id === currentSelectedId ? 'active' : ''}`;
    li.onclick = () => selectLaw(law.id, li);

    li.innerHTML = `
      <div class="law-item-title">${law.title || 'Untitled Record'}</div>
      <div class="law-item-id">ID: ${law.id}</div>
    `;

    container.appendChild(li);
  });
}

function filterLaws() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allLaws.filter(l => 
    (l.title && l.title.toLowerCase().includes(q)) || 
    (l.id && l.id.toLowerCase().includes(q))
  );
  renderList(filtered);
}

async function selectLaw(lawId, element) {
  currentSelectedId = lawId;
  document.querySelectorAll('.law-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');

  const fileUrl = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`;

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('Law record not found.');

    const lawData = await res.json();
    
    document.getElementById('formTitle').textContent = `Edit Law: ${lawId}`;
    document.getElementById('law_id').value = lawData.law_id || lawData.id || '';
    document.getElementById('source_type').value = lawData.source_type || 'MCA Statute';
    document.getElementById('title').value = lawData.title || '';
    document.getElementById('official_url').value = lawData.official_url || '';
    document.getElementById('history').value = lawData.history || '';
    
    const content = lawData.tree || lawData.paragraphs || [];
    document.getElementById('json_content').value = JSON.stringify(content, null, 2);

  } catch (err) {
    showAlert(`Error loading details: ${err.message}`, 'error');
  }
}

function createNewRecord() {
  currentSelectedId = null;
  document.querySelectorAll('.law-item').forEach(el => el.classList.remove('active'));
  document.getElementById('formTitle').textContent = 'Create New Law Entry';
  document.getElementById('law_id').value = '';
  document.getElementById('source_type').value = 'MCA Statute';
  document.getElementById('title').value = '';
  document.getElementById('official_url').value = '';
  document.getElementById('history').value = '';
  document.getElementById('json_content').value = '[]';
}

async function publishRecord() {
  const token = document.getElementById('patToken').value.trim();
  if (!token) {
    showAlert('Please enter your GitHub Personal Access Token.', 'error');
    return;
  }

  const lawId = document.getElementById('law_id').value.trim();
  if (!lawId) {
    showAlert('Please specify a Law ID.', 'error');
    return;
  }

  let parsedContent;
  try {
    parsedContent = JSON.parse(document.getElementById('json_content').value);
  } catch (e) {
    showAlert('Invalid JSON content inside structure box.', 'error');
    return;
  }

  const lawPayload = {
    id: lawId,
    law_id: lawId,
    source_type: document.getElementById('source_type').value,
    title: document.getElementById('title').value,
    official_url: document.getElementById('official_url').value,
    history: document.getElementById('history').value,
    last_updated: new Date().toISOString(),
    tree: parsedContent
  };

  showAlert('Syncing with GitHub...', 'success');

  const filePath = `data/laws/${lawId}.json`;
  const githubApiUrl = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${filePath}`;

  try {
    let existingSha = null;
    const getRes = await fetch(githubApiUrl, { headers: { Authorization: `token ${token}` } });
    if (getRes.ok) {
      const existingData = await getRes.json();
      existingSha = existingData.sha;
    }

    const commitBody = {
      message: `Update record ${lawId}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(lawPayload, null, 2)))),
      branch: REPO_CONFIG.branch
    };
    if (existingSha) commitBody.sha = existingSha;

    const putRes = await fetch(githubApiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(commitBody)
    });

    if (!putRes.ok) throw new Error('Failed to commit record.');

    await updateIndexFile(token, { id: lawId, title: lawPayload.title });
    showAlert(`Record ${lawId} successfully saved!`, 'success');
    loadIndex();

  } catch (err) {
    showAlert(`Error publishing: ${err.message}`, 'error');
  }
}

async function updateIndexFile(token, newEntry) {
  const indexPath = `data/laws-index.json`;
  const indexUrl = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${indexPath}`;

  let indexList = [];
  let sha = null;

  const res = await fetch(indexUrl, { headers: { Authorization: `token ${token}` } });
  if (res.ok) {
    const data = await res.json();
    sha = data.sha;
    indexList = JSON.parse(decodeURIComponent(escape(atob(data.content))));
  }

  const idx = indexList.findIndex(item => item.id === newEntry.id);
  if (idx >= 0) {
    indexList[idx] = newEntry;
  } else {
    indexList.push(newEntry);
  }

  await fetch(indexUrl, {
    method: 'PUT',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: `Update directory index for ${newEntry.id}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(indexList, null, 2)))),
      sha: sha,
      branch: REPO_CONFIG.branch
    })
  });
}

function showAlert(msg, type) {
  const alertBox = document.getElementById('statusAlert');
  alertBox.className = `status-alert ${type}`;
  alertBox.textContent = msg;
  alertBox.style.display = 'block';
}
</script>

</body>
</html>
