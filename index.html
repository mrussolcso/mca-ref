<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relational Law Directory</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
    --card-bg: #ffffff;
    --text: #2d3748;
  }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    margin: 0; 
    padding: 20px; 
  }

  .container { 
    max-width: 1000px; 
    margin: 0 auto; 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
  }
  
  /* Navigation Bar */
  .app-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: var(--primary); 
    color: white; 
    padding: 16px 20px; 
    border-radius: 8px; 
  }

  .app-header h1 { 
    margin: 0; 
    font-size: 1.3rem; 
  }

  .btn-admin { 
    background: rgba(255, 255, 255, 0.2); 
    color: white; 
    text-decoration: none; 
    padding: 8px 14px; 
    border-radius: 6px; 
    font-weight: 600; 
    font-size: 0.9rem; 
    transition: background 0.2s; 
  }

  .btn-admin:hover { 
    background: rgba(255, 255, 255, 0.35); 
  }

  /* Search & Controls */
  .card { 
    background: var(--card-bg); 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    padding: 20px; 
  }

  .search-box { 
    width: 100%; 
    padding: 10px; 
    font-size: 1rem; 
    border: 1px solid var(--border); 
    border-radius: 6px; 
    box-sizing: border-box; 
    margin-bottom: 12px;
  }

  /* Layout Columns */
  .main-layout { 
    display: grid; 
    grid-template-columns: 300px 1fr; 
    gap: 20px; 
  }

  @media (max-width: 768px) {
    .main-layout { grid-template-columns: 1fr; }
  }

  /* Index List */
  .law-list { 
    list-style: none; 
    padding: 0; 
    margin: 0; 
    max-height: 600px; 
    overflow-y: auto; 
  }

  .law-item { 
    padding: 12px; 
    border-bottom: 1px solid var(--border); 
    cursor: pointer; 
    transition: background 0.15s; 
  }

  .law-item:hover { 
    background: #edf2f7; 
  }

  .law-item.active { 
    background: #e2e8f0; 
    border-left: 4px solid var(--primary-light); 
  }

  .law-item-title { 
    font-weight: bold; 
    font-size: 0.92rem; 
    color: var(--primary); 
  }

  .law-item-id { 
    font-size: 0.8rem; 
    color: #718096; 
    margin-top: 2px; 
  }

  /* Detail Pane Styling */
  .detail-pane { 
    min-height: 400px; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .detail-header { 
    border-bottom: 2px solid var(--border); 
    padding-bottom: 16px; 
    margin-bottom: 20px; 
  }

  .badge-source { 
    background: var(--primary-light); 
    color: white; 
    padding: 4px 8px; 
    border-radius: 4px; 
    font-size: 0.75rem; 
    font-weight: bold; 
    text-transform: uppercase; 
    display: inline-block;
  }

  .btn-official { 
    background: var(--primary-light); 
    color: white; 
    padding: 8px 14px; 
    border-radius: 6px; 
    font-weight: 700; 
    text-decoration: none; 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    font-size: 0.85rem; 
  }

  .btn-official:hover { 
    opacity: 0.9; 
  }

  .detail-body { 
    flex-grow: 1; 
    line-height: 1.6; 
  }

  .tree-node-view { 
    margin-bottom: 8px; 
  }

  .detail-footer { 
    border-top: 1px solid var(--border); 
    padding-top: 14px; 
    font-size: 0.82rem; 
    color: #718096; 
    background: #f8fafc; 
    border-radius: 6px; 
    padding: 14px; 
    margin-top: 20px; 
  }

  .empty-state { 
    text-align: center; 
    color: #a0aec0; 
    padding: 40px 20px; 
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- Header Bar -->
  <header class="app-header">
    <h1>📖 Relational Law Directory</h1>
    <a href="admin.html" class="btn-admin">⚙️ Admin Publisher</a>
  </header>

  <!-- Main Directory Layout -->
  <div class="main-layout">
    
    <!-- Left Sidebar: Law Selection Index -->
    <div class="card" style="padding: 14px;">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search laws..." oninput="filterLaws()">
      <ul class="law-list" id="lawListContainer">
        <li class="empty-state">Loading laws...</li>
      </ul>
    </div>

    <!-- Right Pane: Law Detail View -->
    <div class="card detail-pane" id="lawDetailPane">
      
      <!-- Placeholder until selection is made -->
      <div id="detailPlaceholder" class="empty-state">
        👈 Select a law from the index list to view its full details.
      </div>

      <!-- Active Content Panel -->
      <div id="detailContent" style="display: none; height: 100%; flex-direction: column; justify-content: space-between;">
        
        <!-- Top Section: Type, Title, ID, & Link -->
        <div>
          <header class="detail-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
              <div>
                <span class="badge-source" id="view_source_type">MCA Statute</span>
                <h2 id="view_law_title" style="margin: 8px 0 4px 0; color: var(--primary);">--</h2>
                <div style="font-size: 0.9rem; color: #4a5568;" id="view_law_id"><strong>ID:</strong> --</div>
              </div>
              
              <div id="view_official_url_container">
                <a id="view_official_url" href="#" target="_blank" rel="noopener noreferrer" class="btn-official">
                  🔗 Official Publication
                </a>
              </div>
            </div>
          </header>

          <!-- Middle Section: Main Text & Tree Structure -->
          <main class="detail-body" id="view_law_content">
            <!-- Text content renders here -->
          </main>
        </div>

        <!-- Bottom Section: Revision History & Metadata -->
        <footer class="detail-footer">
          <h4 style="margin: 0 0 8px 0; color: var(--primary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
            📜 History & Metadata
          </h4>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <div>
              <strong>Revision History:</strong>
              <div id="view_law_history" style="margin-top: 2px; color: #4a5568;">--</div>
            </div>
            <div>
              <strong>Database Tracking:</strong>
              <div id="view_last_updated" style="margin-top: 2px; color: #4a5568;">--</div>
            </div>
          </div>
        </footer>

      </div>

    </div>

  </div>

</div>

<script>
// Repository Configuration
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let allLaws = [];
let currentSelectedId = null;

// Load index on page load
window.addEventListener('DOMContentLoaded', loadLawsIndex);

async function loadLawsIndex() {
  const container = document.getElementById('lawListContainer');
  const url = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Could not fetch laws index.');

    allLaws = await res.json();
    renderLawList(allLaws);
  } catch (err) {
    container.innerHTML = `<li class="empty-state" style="color: var(--danger);">Failed to load index.</li>`;
    console.error(err);
  }
}

function renderLawList(laws) {
  const container = document.getElementById('lawListContainer');
  container.innerHTML = '';

  if (laws.length === 0) {
    container.innerHTML = `<li class="empty-state">No matching records found.</li>`;
    return;
  }

  laws.forEach(law => {
    const li = document.createElement('li');
    li.className = `law-item ${law.id === currentSelectedId ? 'active' : ''}`;
    li.onclick = () => selectLaw(law.id, li);

    li.innerHTML = `
      <div class="law-item-title">${law.title || 'Untitled Record'}</div>
      <div class="law-item-id">ID: ${law.id}</div>
    `;

    container.appendChild(li);
  });
}

function filterLaws() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allLaws.filter(l => 
    (l.title && l.title.toLowerCase().includes(query)) || 
    (l.id && l.id.toLowerCase().includes(query))
  );
  renderLawList(filtered);
}

async function selectLaw(lawId, element) {
  currentSelectedId = lawId;

  // Highlight active element
  document.querySelectorAll('.law-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');

  const placeholder = document.getElementById('detailPlaceholder');
  const content = document.getElementById('detailContent');

  placeholder.style.display = 'block';
  placeholder.textContent = '⏳ Loading record details...';
  content.style.display = 'none';

  const fileUrl = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`;

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('Law detail record not found.');

    const lawData = await res.json();
    renderLawDetail(lawData);

    placeholder.style.display = 'none';
    content.style.display = 'flex';
  } catch (err) {
    placeholder.textContent = `❌ Error loading record: ${err.message}`;
    console.error(err);
  }
}

function renderLawDetail(lawData) {
  // Top Header Elements
  document.getElementById('view_source_type').textContent = lawData.source_type || 'MCA Statute';
  document.getElementById('view_law_title').textContent = lawData.title || 'Untitled Record';
  document.getElementById('view_law_id').innerHTML = `<strong>ID:</strong> ${lawData.law_id || lawData.id}`;

  const urlBtnContainer = document.getElementById('view_official_url_container');
  const urlLink = document.getElementById('view_official_url');

  if (lawData.official_url && lawData.official_url.trim() !== '') {
    urlLink.href = lawData.official_url;
    urlBtnContainer.style.display = 'block';
  } else {
    urlBtnContainer.style.display = 'none';
  }

  // Main Content Body
  const contentContainer = document.getElementById('view_law_content');
  if (lawData.tree && lawData.tree.length > 0) {
    contentContainer.innerHTML = renderTreeToHTML(lawData.tree);
  } else if (lawData.paragraphs && lawData.paragraphs.length > 0) {
    contentContainer.innerHTML = renderParagraphsToHTML(lawData.paragraphs);
  } else {
    contentContainer.innerHTML = '<p style="color: #a0aec0; font-style: italic;">No text content available for this record.</p>';
  }

  // Bottom Footer History Elements
  document.getElementById('view_law_history').textContent = lawData.history || 'No historical revision notes recorded.';

  if (lawData.last_updated) {
    const updatedDate = new Date(lawData.last_updated).toLocaleDateString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
    document.getElementById('view_last_updated').textContent = `Last Updated: ${updatedDate}`;
  } else {
    document.getElementById('view_last_updated').textContent = 'Last Updated: Unknown';
  }
}

// Tree view recursive renderer
function renderTreeToHTML(nodes, level = 0) {
  let html = '<div class="law-tree-view">';
  nodes.forEach(node => {
    const indent = level * 16;
    html += `
      <div class="tree-node-view" style="margin-left: ${indent}px;">
        <strong>${node.counter || ''}</strong> ${node.text || ''}
        ${node.children && node.children.length > 0 ? renderTreeToHTML(node.children, level + 1) : ''}
      </div>
    `;
  });
  html += '</div>';
  return html;
}

// Paragraph fallback renderer
function renderParagraphsToHTML(paragraphs) {
  return paragraphs.map(p => `
    <div style="margin-bottom: 8px; margin-left: ${(p.indent || 1) * 12}px;">
      <strong>${p.counter || ''}</strong> ${p.text || ''}
    </div>
  `).join('');
}
</script>

</body>
</html>
