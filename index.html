<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montana Law & Offense Reference Platform</title>
<style>
  :root {
    --primary: #1a365d;
    --primary-light: #2b6cb0;
    --border: #cbd5e0;
    --bg: #f7fafc;
    --text: #2d3748;
    --highlight-yellow-bg: #fefcbf;
    --highlight-yellow-border: #d69e2e;
    --highlight-green-bg: #e6fffa;
    --highlight-green-border: #319795;
  }

  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: var(--text); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }

  /* Header Bar */
  header { background: #fff; color: var(--text); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--primary); }
  .btn-admin { background: #edf2f7; color: var(--text); text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--border); }

  /* Main 3-Column Layout */
  .app-container { display: flex; flex: 1; overflow: hidden; }

  /* COLUMN 1: Index List */
  .col-index { width: 280px; min-width: 280px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .index-search-box { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .tab-group { display: flex; gap: 4px; }
  .tab-btn { flex: 1; padding: 6px; background: #edf2f7; border: 1px solid var(--border); border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
  .tab-btn.active { background: #fff; border-bottom: 2px solid var(--primary); color: var(--primary); }
  .index-search-box input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
  .index-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
  .index-item { padding: 10px 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
  .index-item:hover { background: #f7fafc; }
  .index-item.active { background: #ebf8ff; border-left: 4px solid var(--primary-light); }
  .item-id { font-weight: bold; font-size: 0.85rem; color: var(--primary); }
  .item-title { font-size: 0.78rem; color: #4a5568; margin-top: 2px; line-height: 1.3; }

  /* COLUMN 2: Main Offense Card & Law Reader Area */
  .col-main { flex: 1; background: #fff; padding: 20px 28px; overflow-y: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
  
  /* Offense Header Card inside Middle Column */
  .offense-card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .offense-header { display: flex; flex-direction: column; gap: 4px; }
  .tag-badge { display: inline-block; background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; width: fit-content; }
  .offense-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); line-height: 1.3; }
  .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; border-top: 1px solid #edf2f7; border-bottom: 1px solid #edf2f7; padding: 8px 0; font-size: 0.85rem; }
  .data-row { display: flex; gap: 6px; }
  .data-label { color: #718096; }
  .data-val { font-weight: 600; }
  .box-desc { background: #f7fafc; border: 1px solid var(--border); padding: 10px; border-radius: 4px; font-size: 0.85rem; line-height: 1.4; }
  .section-links { font-size: 0.82rem; display: flex; flex-direction: column; gap: 6px; }
  .link-box-yellow { background: var(--highlight-yellow-bg); padding: 6px 10px; border-radius: 4px; border-left: 3px solid var(--highlight-yellow-border); }
  .link-box-green { background: var(--highlight-green-bg); padding: 6px 10px; border-radius: 4px; border-left: 3px solid var(--highlight-green-border); }

  /* Law Text Reader Styling */
  .law-reader { display: flex; flex-direction: column; gap: 12px; }
  .law-header h2 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.2rem; }
  .law-meta { font-size: 0.8rem; color: #718096; border-bottom: 1px solid var(--border); padding-bottom: 10px; line-height: 1.4; }
  .mca-text-body { font-size: 0.9rem; line-height: 1.5; }
  .mca-paragraph { padding: 4px 6px; border-radius: 3px; margin-bottom: 4px; transition: background-color 0.2s, border-left 0.2s; }
  
  /* Highlighting Classes */
  .mca-paragraph.highlight-primary { background-color: var(--highlight-yellow-bg) !important; border-left: 4px solid var(--highlight-yellow-border) !important; }
  .mca-paragraph.highlight-secondary { background-color: var(--highlight-green-bg) !important; border-left: 4px solid var(--highlight-green-border) !important; }

  .indent-1 { margin-left: 0px; }
  .indent-2 { margin-left: 18px; }
  .indent-3 { margin-left: 36px; }
  .indent-4 { margin-left: 54px; }
  .mca-counter { font-weight: bold; margin-right: 6px; }

  /* Separate History & Metadata Footer Box at Bottom of Middle Column */
  .law-footer-meta { margin-top: 16px; padding: 12px; background: #f7fafc; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; color: #4a5568; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; }
  .law-footer-meta h4 { margin: 0; font-size: 0.85rem; color: var(--primary); font-weight: bold; }

  /* COLUMN 3: Associated Offenses */
  .col-associated { width: 300px; min-width: 300px; background: #fff; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .col-associated h3 { margin: 0; font-size: 0.95rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .assoc-item { padding: 8px 10px; background: #f7fafc; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .assoc-item:hover { background: #ebf8ff; border-color: var(--primary-light); }
  .assoc-tag { font-weight: bold; font-size: 0.82rem; color: var(--primary); }
  .assoc-title { font-size: 0.78rem; color: #4a5568; line-height: 1.3; }

  .empty-state { color: #a0aec0; text-align: center; margin-top: 40px; font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <h1>Montana Law & Offense Reference Platform</h1>
  <a href="admin.html" class="btn-admin">Admin Publisher</a>
</header>

<div class="app-container">

  <!-- Column 1 (Left): Index List & Search -->
  <div class="col-index">
    <div class="index-search-box">
      <div class="tab-group">
        <button id="tabOffenses" class="tab-btn active" onclick="switchTab('offenses')">Offenses</button>
        <button id="tabLaws" class="tab-btn" onclick="switchTab('laws')">Laws</button>
      </div>
      <input type="text" id="searchInput" placeholder="Search by ID, title, statute..." oninput="renderIndexList()">
    </div>
    <ul id="indexList" class="index-list"></ul>
  </div>

  <!-- Column 2 (Middle): Offense Header + Statute Text Reader -->
  <div class="col-main" id="colMain">
    <div class="empty-state">Select a record from the index to view offense details and law text.</div>
  </div>

  <!-- Column 3 (Right): Associated Offenses -->
  <div class="col-associated">
    <h3>Associated Offenses</h3>
    <div id="associatedList" class="empty-state" style="margin-top: 20px;">No associated offenses currently linked.</div>
  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let activeTab = 'offenses';
let offensesIndex = [];
let lawsIndex = [];
let selectedOffense = null;
let selectedLaw = null;

window.addEventListener('DOMContentLoaded', async () => {
  await loadIndexes();
});

async function loadIndexes() {
  try {
    const offensesRes = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/offenses-index.json`);
    if (offensesRes.ok) offensesIndex = await offensesRes.json();

    const lawsRes = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`);
    if (lawsRes.ok) lawsIndex = await lawsRes.json();

    renderIndexList();
  } catch (err) {
    console.error("Error loading index files:", err);
  }
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabOffenses').classList.toggle('active', tab === 'offenses');
  document.getElementById('tabLaws').classList.toggle('active', tab === 'laws');
  renderIndexList();
}

function renderIndexList() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const listEl = document.getElementById('indexList');
  listEl.innerHTML = '';

  const dataset = activeTab === 'offenses' ? offensesIndex : lawsIndex;
  const filtered = dataset.filter(item => {
    const id = (item.id || '').toLowerCase();
    const name = (item.name || '').toLowerCase();
    const title = (item.title || '').toLowerCase();
    const tag = (item.display_tag || '').toLowerCase();
    return id.includes(query) || name.includes(query) || title.includes(query) || tag.includes(query);
  });

  filtered.forEach(item => {
    const li = document.createElement('li');
    li.className = 'index-item';
    
    if (activeTab === 'offenses') {
      if (selectedOffense && selectedOffense.offense_id === item.id) li.classList.add('active');
      li.innerHTML = `
        <div class="item-id">${item.display_tag || item.id}</div>
        <div class="item-title">${item.name || ''}</div>
      `;
      li.onclick = () => selectOffense(item.id);
    } else {
      if (selectedLaw && selectedLaw.law_id === item.id) li.classList.add('active');
      li.innerHTML = `
        <div class="item-id">MCA ${item.id}</div>
        <div class="item-title">${item.title || ''}</div>
      `;
      li.onclick = () => selectLaw(item.id);
    }

    listEl.appendChild(li);
  });
}

async function selectOffense(offenseId) {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/offenses/${offenseId}.json`);
    if (!res.ok) return;

    selectedOffense = await res.json();
    renderIndexList();

    if (selectedOffense.law_id) {
      await renderMainView(selectedOffense.law_id);
    } else {
      renderOffenseOnlyView();
    }
  } catch (err) {
    console.error(`Error loading offense ${offenseId}:`, err);
  }
}

async function selectLaw(lawId) {
  selectedOffense = null;
  renderIndexList();
  await renderMainView(lawId);
}

function cleanAnchorSet(anchors) {
  if (!anchors) return new Set();
  const list = Array.isArray(anchors) ? anchors : anchors.toString().split(',');
  return new Set(list.map(s => String(s).trim()).filter(Boolean));
}

function renderAssociatedOffenses(lawId) {
  const container = document.getElementById('associatedList');
  if (!lawId) {
    container.innerHTML = '<div class="empty-state">No associated offenses currently linked.</div>';
    return;
  }

  // Find all offenses referencing this MCA statute law_id
  const matches = offensesIndex.filter(off => String(off.law_id || '').trim() === String(lawId).trim());

  if (matches.length === 0) {
    container.innerHTML = '<div class="empty-state">No associated offenses currently linked.</div>';
    return;
  }

  container.innerHTML = matches.map(off => `
    <div class="assoc-item" onclick="selectOffense('${off.id}')">
      <div class="assoc-tag">${off.display_tag || off.id}</div>
      <div class="assoc-title">${off.name || ''}</div>
    </div>
  `).join('');
}

async function renderMainView(lawId) {
  const colMain = document.getElementById('colMain');
  
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`);
    if (!res.ok) {
      colMain.innerHTML = `<div class="empty-state">Statute law data for MCA ${lawId} not found.</div>`;
      renderAssociatedOffenses(null);
      return;
    }

    selectedLaw = await res.json();

    // Prepare Offense Card HTML
    let offenseCardHtml = '';
    if (selectedOffense) {
      const bondText = selectedOffense.bond_type === 'amount' 
        ? `$${selectedOffense.bond_amount}` 
        : (selectedOffense.bond_type === 'no_bond' ? 'No Bond (Hold)' : 'Per Schedule / Discretionary');

      const primaryList = Array.from(cleanAnchorSet(selectedOffense.primary_anchors || selectedOffense.target_anchors)).join(', ') || 'None';
      const secondaryList = Array.from(cleanAnchorSet(selectedOffense.secondary_anchors)).join(', ') || 'None';

      offenseCardHtml = `
        <div class="offense-card">
          <div class="offense-header">
            <span class="tag-badge">${selectedOffense.display_tag || selectedOffense.offense_id}</span>
            <div class="offense-title">${selectedOffense.name}</div>
          </div>

          <div class="data-grid">
            <div class="data-row"><span class="data-label">Severity:</span><span class="data-val">${selectedOffense.severity || 'N/A'}</span></div>
            <div class="data-row"><span class="data-label">Bond Schedule:</span><span class="data-val">${bondText}</span></div>
            <div class="data-row"><span class="data-label">Mandatory Appearance:</span><span class="data-val">${selectedOffense.mandatory_appearance ? 'Yes' : 'No'}</span></div>
            <div class="data-row"><span class="data-label">Occurrence/Sequence:</span><span class="data-val">${selectedOffense.occurrence || '1'}</span></div>
            <div class="data-row"><span class="data-label">Linked Statute:</span><span class="data-val">MCA ${selectedOffense.law_id || 'None'}</span></div>
          </div>

          <div>
            <div class="data-label" style="font-weight:bold; font-size:0.8rem; margin-bottom:4px;">Description / Conditions</div>
            <div class="box-desc">
              ${selectedOffense.description || 'No description provided.'}
              ${selectedOffense.conditions ? `<br><br><strong>Conditions:</strong> ${selectedOffense.conditions}` : ''}
            </div>
          </div>

          <div class="section-links">
            <div class="data-label" style="font-weight:bold; font-size:0.8rem;">Categorized Section Links</div>
            <div class="link-box-yellow"><strong>Primary Sections:</strong> ${primaryList}</div>
            <div class="link-box-green"><strong>Secondary Sections:</strong> ${secondaryList}</div>
          </div>
        </div>
      `;
    }

    // Clean anchor keys for strict highlighting comparison
    const primarySet = cleanAnchorSet(selectedOffense ? (selectedOffense.primary_anchors || selectedOffense.target_anchors) : []);
    const secondarySet = cleanAnchorSet(selectedOffense ? selectedOffense.secondary_anchors : []);

    let paragraphsHtml = '';
    (selectedLaw.paragraphs || []).forEach(p => {
      const indentClass = `indent-${p.indent || 1}`;
      let highlightClass = '';

      const anchorKey = String(p.anchor_id || p.id || '').trim();
      
      if (primarySet.has(anchorKey)) {
        highlightClass = 'highlight-primary';
      } else if (secondarySet.has(anchorKey)) {
        highlightClass = 'highlight-secondary';
      }

      paragraphsHtml += `
        <div id="anchor-${anchorKey}" class="mca-paragraph ${indentClass} ${highlightClass}">
          <span class="mca-counter">${p.counter}</span>
          <span class="mca-text">${p.text}</span>
        </div>
      `;
    });

    const lawReaderHtml = `
      <div class="law-reader">
        <div class="law-header">
          <h2>MCA ${selectedLaw.law_id}: ${selectedLaw.title}</h2>
          <div class="law-meta">
            <span>Source: ${selectedLaw.source_type || 'MCA Statute'}</span> | 
            ${selectedLaw.official_url ? `<a href="${selectedLaw.official_url}" target="_blank" rel="noopener">Official MCA Page</a>` : ''}
          </div>
        </div>
        <div class="mca-text-body">
          ${paragraphsHtml || '<p>No statute paragraph text available.</p>'}
        </div>
        
        <!-- Bottom Footer Meta & History Section -->
        <div class="law-footer-meta">
          <h4>History & Database Metadata</h4>
          <div><strong>History:</strong> ${selectedLaw.history || 'No official statutory history record provided.'}</div>
          <div><strong>Database Info:</strong> Last verified from <code>${REPO_CONFIG.owner}/${REPO_CONFIG.repo}</code> on branch <code>${REPO_CONFIG.branch}</code>.</div>
        </div>
      </div>
    `;

    colMain.innerHTML = offenseCardHtml + lawReaderHtml;
    renderAssociatedOffenses(selectedLaw.law_id);

    // Auto-scroll to highlighted section
    const targetElement = colMain.querySelector('.highlight-primary, .highlight-secondary');
    if (targetElement) {
      targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

  } catch (err) {
    colMain.innerHTML = `<div class="empty-state">Error rendering statutory text: ${err.message}</div>`;
    renderAssociatedOffenses(null);
  }
}

function renderOffenseOnlyView() {
  const colMain = document.getElementById('colMain');
  if (!selectedOffense) return;

  const bondText = selectedOffense.bond_type === 'amount' 
    ? `$${selectedOffense.bond_amount}` 
    : (selectedOffense.bond_type === 'no_bond' ? 'No Bond (Hold)' : 'Per Schedule / Discretionary');

  colMain.innerHTML = `
    <div class="offense-card">
      <div class="offense-header">
        <span class="tag-badge">${selectedOffense.display_tag || selectedOffense.offense_id}</span>
        <div class="offense-title">${selectedOffense.name}</div>
      </div>
      <div class="data-grid">
        <div class="data-row"><span class="data-label">Severity:</span><span class="data-val">${selectedOffense.severity || 'N/A'}</span></div>
        <div class="data-row"><span class="data-label">Bond Schedule:</span><span class="data-val">${bondText}</span></div>
      </div>
      <div class="box-desc">${selectedOffense.description || 'No description provided.'}</div>
    </div>
    <div class="empty-state">No linked statute found for this offense record.</div>
  `;

  renderAssociatedOffenses(selectedOffense.law_id);
}
</script>

</body>
</html>
