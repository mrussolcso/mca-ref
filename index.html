<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montana Law & Offense Reference Platform</title>
<style>
  :root {
    --primary: #1a365d;
    --primary-light: #2b6cb0;
    --border: #cbd5e0;
    --bg: #f7fafc;
    --text: #2d3748;
    --highlight-yellow-bg: #fefcbf;
    --highlight-yellow-border: #d69e2e;
    --highlight-green-bg: #f0fff4;
    --highlight-green-border: #38a169;
  }

  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: var(--text); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }

  /* Header Bar */
  header { background: #fff; color: var(--text); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--primary); }
  .btn-admin { background: #edf2f7; color: var(--text); text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--border); }

  /* Main 3-Column App Layout */
  .app-container { display: flex; flex: 1; overflow: hidden; }

  /* COLUMN 1 (LEFT): Index List & Search */
  .col-index { width: 280px; min-width: 280px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .index-search-box { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .tab-group { display: flex; gap: 4px; }
  .tab-btn { flex: 1; padding: 6px; background: #edf2f7; border: 1px solid var(--border); border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
  .tab-btn.active { background: #fff; border-bottom: 2px solid var(--primary); color: var(--primary); }
  .index-search-box input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
  .index-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
  .index-item { padding: 10px 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; }
  .index-item:hover { background: #f7fafc; }
  .index-item.active { background: #ebf8ff; border-left: 4px solid var(--primary-light); }
  .item-id { font-weight: bold; font-size: 0.85rem; color: var(--primary); }
  .item-title { font-size: 0.78rem; color: #4a5568; margin-top: 2px; line-height: 1.3; }

  /* COLUMN 2 (MIDDLE): Statutory Text Reader */
  .col-law { flex: 1; background: #fff; padding: 20px 28px; overflow-y: auto; border-right: 1px solid var(--border); }
  .law-header h2 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.2rem; }
  .law-meta { font-size: 0.8rem; color: #718096; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; line-height: 1.4; }

  /* MCA Nested Subsection Styles */
  .mca-text-body { font-size: 0.9rem; line-height: 1.5; }
  .mca-paragraph { padding: 4px 6px; border-radius: 3px; margin-bottom: 4px; transition: background-color 0.2s, border-left 0.2s; }
  
  /* Yellow/Green Highlighting */
  .mca-paragraph.highlight-primary { background-color: var(--highlight-yellow-bg) !important; border-left: 4px solid var(--highlight-yellow-border) !important; }
  .mca-paragraph.highlight-secondary { background-color: var(--highlight-green-bg) !important; border-left: 4px solid var(--highlight-green-border) !important; }

  .indent-1 { margin-left: 0px; }
  .indent-2 { margin-left: 18px; }
  .indent-3 { margin-left: 36px; }
  .indent-4 { margin-left: 54px; }
  .mca-counter { font-weight: bold; margin-right: 6px; }

  /* COLUMN 3 (RIGHT): Offense Record Details Card */
  .col-offense { width: 320px; min-width: 320px; background: #fff; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .offense-title { font-size: 1rem; font-weight: bold; color: var(--primary); margin: 4px 0 0 0; line-height: 1.3; }
  .tag-badge { display: inline-block; background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
  .data-row { display: flex; justify-content: space-between; border-bottom: 1px solid #edf2f7; padding: 6px 0; font-size: 0.85rem; }
  .data-label { color: #718096; }
  .data-val { font-weight: 600; }
  .box-desc { background: #f7fafc; border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-size: 0.82rem; line-height: 1.4; margin-top: 4px; }

  .empty-state { color: #a0aec0; text-align: center; margin-top: 40px; font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <h1>Montana Law & Offense Reference Platform</h1>
  <a href="admin.html" class="btn-admin">Admin Publisher</a>
</header>

<div class="app-container">

  <!-- Column 1 (Left): Index List & Search -->
  <div class="col-index">
    <div class="index-search-box">
      <div class="tab-group">
        <button id="tabOffenses" class="tab-btn active" onclick="switchTab('offenses')">Offenses</button>
        <button id="tabLaws" class="tab-btn" onclick="switchTab('laws')">Laws</button>
      </div>
      <input type="text" id="searchInput" placeholder="Search by ID, title, statute..." oninput="renderIndexList()">
    </div>
    <ul id="indexList" class="index-list"></ul>
  </div>

  <!-- Column 2 (Middle): Statutory Text Reader -->
  <div class="col-law" id="colLaw">
    <div class="empty-state">Select a record to read statutory law text.</div>
  </div>

  <!-- Column 3 (Right): Offense Details Schedule Card -->
  <div class="col-offense" id="colOffense">
    <div class="empty-state">Select an offense record to view details.</div>
  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let activeTab = 'offenses';
let offensesIndex = [];
let lawsIndex = [];
let selectedOffense = null;
let selectedLaw = null;

window.addEventListener('DOMContentLoaded', async () => {
  await loadIndexes();
});

async function loadIndexes() {
  try {
    const offensesRes = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/offenses-index.json`);
    if (offensesRes.ok) offensesIndex = await offensesRes.json();

    const lawsRes = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`);
    if (lawsRes.ok) lawsIndex = await lawsRes.json();

    renderIndexList();
  } catch (err) {
    console.error("Error loading index files:", err);
  }
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabOffenses').classList.toggle('active', tab === 'offenses');
  document.getElementById('tabLaws').classList.toggle('active', tab === 'laws');
  renderIndexList();
}

function renderIndexList() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const listEl = document.getElementById('indexList');
  listEl.innerHTML = '';

  const dataset = activeTab === 'offenses' ? offensesIndex : lawsIndex;
  const filtered = dataset.filter(item => {
    const id = (item.id || '').toLowerCase();
    const name = (item.name || '').toLowerCase();
    const title = (item.title || '').toLowerCase();
    const tag = (item.display_tag || '').toLowerCase();
    return id.includes(query) || name.includes(query) || title.includes(query) || tag.includes(query);
  });

  filtered.forEach(item => {
    const li = document.createElement('li');
    li.className = 'index-item';
    
    if (activeTab === 'offenses') {
      if (selectedOffense && selectedOffense.offense_id === item.id) li.classList.add('active');
      li.innerHTML = `
        <div class="item-id">${item.display_tag || item.id}</div>
        <div class="item-title">${item.name || ''}</div>
      `;
      li.onclick = () => selectOffense(item.id);
    } else {
      if (selectedLaw && selectedLaw.law_id === item.id) li.classList.add('active');
      li.innerHTML = `
        <div class="item-id">MCA ${item.id}</div>
        <div class="item-title">${item.title || ''}</div>
      `;
      li.onclick = () => selectLaw(item.id);
    }

    listEl.appendChild(li);
  });
}

async function selectOffense(offenseId) {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/offenses/${offenseId}.json`);
    if (!res.ok) return;

    selectedOffense = await res.json();
    renderOffenseDetails();
    renderIndexList();

    if (selectedOffense.law_id) {
      await loadAndDisplayLaw(selectedOffense.law_id);
    } else {
      document.getElementById('colLaw').innerHTML = '<div class="empty-state">No linked statutory law found for this offense.</div>';
    }
  } catch (err) {
    console.error(`Error loading offense ${offenseId}:`, err);
  }
}

function renderOffenseDetails() {
  const col = document.getElementById('colOffense');
  if (!selectedOffense) return;

  const bondText = selectedOffense.bond_type === 'amount' 
    ? `$${selectedOffense.bond_amount}` 
    : (selectedOffense.bond_type === 'no_bond' ? 'No Bond (Hold)' : 'Per Schedule / Discretionary');

  const primaryAnchors = (selectedOffense.primary_anchors || selectedOffense.target_anchors || []).join(', ') || 'None';
  const secondaryAnchors = (selectedOffense.secondary_anchors || []).join(', ') || 'None';

  col.innerHTML = `
    <div>
      <span class="tag-badge">${selectedOffense.display_tag || selectedOffense.offense_id}</span>
      <div class="offense-title">${selectedOffense.name}</div>
    </div>

    <div class="data-row"><span class="data-label">Severity</span><span class="data-val">${selectedOffense.severity || 'N/A'}</span></div>
    <div class="data-row"><span class="data-label">Bond Schedule</span><span class="data-val">${bondText}</span></div>
    <div class="data-row"><span class="data-label">Mandatory Appearance</span><span class="data-val">${selectedOffense.mandatory_appearance ? 'Yes' : 'No'}</span></div>
    <div class="data-row"><span class="data-label">Occurrence / Sequence</span><span class="data-val">${selectedOffense.occurrence || '1'}</span></div>
    <div class="data-row"><span class="data-label">Linked Statute</span><span class="data-val">MCA ${selectedOffense.law_id || 'None'}</span></div>

    <div>
      <div class="data-label" style="font-weight:bold; font-size:0.8rem; margin-bottom:4px;">Description / Conditions</div>
      <div class="box-desc">
        ${selectedOffense.description || 'No description provided.'}
        ${selectedOffense.conditions ? `<br><br><strong>Conditions:</strong> ${selectedOffense.conditions}` : ''}
      </div>
    </div>

    <div>
      <div class="data-label" style="font-weight:bold; font-size:0.8rem; margin-bottom:6px;">Categorized Section Links</div>
      <div style="font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px;">
        <div style="background: var(--highlight-yellow-bg); padding: 6px; border-radius: 4px; border-left: 3px solid var(--highlight-yellow-border);">
          <strong>Primary Sections:</strong> ${primaryAnchors}
        </div>
        <div style="background: var(--highlight-green-bg); padding: 6px; border-radius: 4px; border-left: 3px solid var(--highlight-green-border);">
          <strong>Secondary Sections:</strong> ${secondaryAnchors}
        </div>
      </div>
    </div>
  `;
}

async function selectLaw(lawId) {
  selectedOffense = null;
  renderOffenseDetails();
  document.getElementById('colOffense').innerHTML = '<div class="empty-state">Direct statutory law selected.</div>';
  await loadAndDisplayLaw(lawId);
  renderIndexList();
}

async function loadAndDisplayLaw(lawId) {
  const col = document.getElementById('colLaw');
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`);
    if (!res.ok) {
      col.innerHTML = `<div class="empty-state">Statute law data for MCA ${lawId} not found.</div>`;
      return;
    }

    selectedLaw = await res.json();
    let paragraphsHtml = '';

    const primarySet = new Set(selectedOffense ? (selectedOffense.primary_anchors || selectedOffense.target_anchors || []) : []);
    const secondarySet = new Set(selectedOffense ? (selectedOffense.secondary_anchors || []) : []);

    (selectedLaw.paragraphs || []).forEach(p => {
      const indentClass = `indent-${p.indent || 1}`;
      let highlightClass = '';

      const anchorKey = p.anchor_id || p.id;
      if (primarySet.has(anchorKey)) {
        highlightClass = 'highlight-primary';
      } else if (secondarySet.has(anchorKey)) {
        highlightClass = 'highlight-secondary';
      }

      paragraphsHtml += `
        <div id="anchor-${anchorKey}" class="mca-paragraph ${indentClass} ${highlightClass}">
          <span class="mca-counter">${p.counter}</span>
          <span class="mca-text">${p.text}</span>
        </div>
      `;
    });

    col.innerHTML = `
      <div class="law-header">
        <h2>MCA ${selectedLaw.law_id}: ${selectedLaw.title}</h2>
        <div class="law-meta">
          <span>Source: ${selectedLaw.source_type || 'MCA Statute'}</span> | 
          ${selectedLaw.official_url ? `<a href="${selectedLaw.official_url}" target="_blank" rel="noopener">Official MCA Page</a>` : ''}
          ${selectedLaw.history ? `<br><span>History: ${selectedLaw.history}</span>` : ''}
        </div>
      </div>
      <div class="mca-text-body">
        ${paragraphsHtml || '<p>No statute paragraph text available.</p>'}
      </div>
    `;

    const targetElement = col.querySelector('.highlight-primary, .highlight-secondary');
    if (targetElement) {
      targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

  } catch (err) {
    col.innerHTML = `<div class="empty-state">Error rendering statutory text: ${err.message}</div>`;
  }
}
</script>

</body>
</html>
