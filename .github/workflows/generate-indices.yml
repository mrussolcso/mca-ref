name: Auto-Generate Law and Offense Indices

on:
  push:
    paths:
      - 'data/laws/*.json'
      - 'data/offenses/*.json'
    branches:
      - main

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild Index Files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // Build laws-index.json
            const lawsDir = "data/laws";
            let lawsIndex = [];
            if (fs.existsSync(lawsDir)) {
              const files = fs.readdirSync(lawsDir).filter(f => f.endsWith(".json"));
              lawsIndex = files.map(file => {
                const content = JSON.parse(fs.readFileSync(path.join(lawsDir, file), "utf8"));
                return {
                  id: content.law_id || file.replace(".json", ""),
                  law_id: content.law_id || file.replace(".json", ""),
                  title: content.title || "",
                  short_title: content.short_title || ""
                };
              });
            }
            fs.writeFileSync("data/laws-index.json", JSON.stringify(lawsIndex, null, 2));

            // Build offenses-index.json
            const offensesDir = "data/offenses";
            let offensesIndex = [];
            if (fs.existsSync(offensesDir)) {
              const files = fs.readdirSync(offensesDir).filter(f => f.endsWith(".json"));
              offensesIndex = files.map(file => {
                const content = JSON.parse(fs.readFileSync(path.join(offensesDir, file), "utf8"));
                return {
                  id: content.offense_id || file.replace(".json", ""),
                  name: content.name || "",
                  occurrence: content.occurrence || null,
                  severity: content.severity || "",
                  law_id: content.law_id || ""
                };
              });
            }
            fs.writeFileSync("data/offenses-index.json", JSON.stringify(offensesIndex, null, 2));
          '

      - name: Commit and Push Index Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laws-index.json data/offenses-index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: regenerate index files" && git push)
