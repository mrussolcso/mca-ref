<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relational Law Directory</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
    --card-bg: #ffffff;
    --text: #2d3748;
  }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    margin: 0; 
    padding: 20px; 
  }

  .container { 
    max-width: 1400px; 
    margin: 0 auto; 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
  } 
  
  /* Navigation Bar */
  .app-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: var(--primary); 
    color: white; 
    padding: 16px 20px; 
    border-radius: 8px; 
  }

  .app-header h1 { 
    margin: 0; 
    font-size: 1.3rem; 
  }

  .btn-admin { 
    background: rgba(255, 255, 255, 0.2); 
    color: white; 
    text-decoration: none; 
    padding: 8px 14px; 
    border-radius: 6px; 
    font-weight: 600; 
    font-size: 0.9rem; 
    transition: background 0.2s; 
  }

  .btn-admin:hover { 
    background: rgba(255, 255, 255, 0.35); 
  }

  /* Three-Column Grid Layout */
  .three-column-layout { 
    display: grid; 
    grid-template-columns: 280px 1fr 300px; 
    gap: 20px; 
    align-items: start;
  }

  @media (max-width: 1024px) {
    .three-column-layout { grid-template-columns: 250px 1fr; }
    .offenses-column { grid-column: span 2; }
  }

  @media (max-width: 768px) {
    .three-column-layout { grid-template-columns: 1fr; }
    .offenses-column { grid-column: span 1; }
  }

  .card { 
    background: var(--card-bg); 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    padding: 20px; 
  }

  .search-box { 
    width: 100%; 
    padding: 10px; 
    font-size: 0.9rem; 
    border: 1px solid var(--border); 
    border-radius: 6px; 
    box-sizing: border-box; 
    margin-bottom: 12px;
  }

  /* Left Column: Law List */
  .law-list { 
    list-style: none; 
    padding: 0; 
    margin: 0; 
    max-height: 650px; 
    overflow-y: auto; 
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .law-item { 
    padding: 10px 12px; 
    border-bottom: 1px solid var(--border); 
    cursor: pointer; 
    transition: background 0.15s; 
  }

  .law-item:last-child { border-bottom: none; }

  .law-item:hover { 
    background: #edf2f7; 
  }

  .law-item.active { 
    background: #ebf8ff; 
    border-left: 4px solid var(--primary-light); 
  }

  .law-item-title { 
    font-weight: 600; 
    font-size: 0.88rem; 
    color: var(--primary); 
  }

  .law-item-id { 
    font-size: 0.78rem; 
    color: #718096; 
    margin-top: 2px; 
  }

  /* Middle Column: Detail Pane */
  .detail-pane { 
    min-height: 500px; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .detail-header { 
    border-bottom: 2px solid var(--border); 
    padding-bottom: 14px; 
    margin-bottom: 16px; 
  }

  .badge-source { 
    background: var(--primary-light); 
    color: white; 
    padding: 3px 8px; 
    border-radius: 4px; 
    font-size: 0.75rem; 
    font-weight: bold; 
    text-transform: uppercase; 
    display: inline-block;
  }

  .btn-official { 
    background: var(--primary-light); 
    color: white; 
    padding: 6px 12px; 
    border-radius: 6px; 
    font-weight: 600; 
    text-decoration: none; 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    font-size: 0.82rem; 
  }

  .btn-official:hover { 
    opacity: 0.9; 
  }

  .detail-body { 
    flex-grow: 1; 
    line-height: 1.6; 
    margin-bottom: 20px;
  }

  .tree-node-view { 
    margin-bottom: 8px; 
  }

  /* Footer History Box inside Middle Column */
  .detail-footer { 
    border-top: 1px solid var(--border); 
    font-size: 0.82rem; 
    color: #718096; 
    background: #f8fafc; 
    border-radius: 6px; 
    padding: 12px; 
    margin-top: 15px; 
  }

  .detail-footer-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Right Column: Offenses */
  .offense-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .offense-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
    background: #faf5ff;
    border-left: 3px solid #805ad5;
  }

  .offense-title {
    font-weight: bold;
    font-size: 0.88rem;
    color: #44337a;
  }

  .offense-severity {
    font-size: 0.78rem;
    color: #6b46c1;
    margin-top: 4px;
  }

  .empty-msg { 
    text-align: center; 
    color: #a0aec0; 
    padding: 30px 10px; 
    font-style: italic;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- App Header -->
  <header class="app-header">
    <h1>📖 Relational Law Directory</h1>
    <a href="admin.html" class="btn-admin">⚙️ Admin Publisher</a>
  </header>

  <!-- Main 3-Column Layout -->
  <div class="three-column-layout">
    
    <!-- LEFT COLUMN: Select Law -->
    <div class="card">
      <h3 style="margin-top:0; font-size:1rem; color:var(--primary);">Select Law</h3>
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search laws..." oninput="filterLaws()">
      <ul class="law-list" id="lawListContainer">
        <li class="empty-msg">Loading laws...</li>
      </ul>
    </div>

    <!-- MIDDLE COLUMN: Law Detail Pane -->
    <div class="card detail-pane" id="lawDetailCard">
      
      <div id="detailPlaceholder" class="empty-msg">
        Select a law from the left list to view details.
      </div>

      <div id="detailContent" style="display: none; height: 100%; flex-direction: column; justify-content: space-between;">
        
        <!-- Top Section: Type, Title, ID & Link -->
        <div>
          <header class="detail-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
              <div>
                <span class="badge-source" id="view_source_type">MCA Statute</span>
                <h2 id="view_law_title" style="margin: 8px 0 4px 0; color: var(--primary);">--</h2>
                <div style="font-size: 0.88rem; color: #4a5568;" id="view_law_id"><strong>ID:</strong> --</div>
              </div>
              
              <div id="view_official_url_container">
                <a id="view_official_url" href="#" target="_blank" rel="noopener noreferrer" class="btn-official">
                  🔗 Official Link
                </a>
              </div>
            </div>
          </header>

          <!-- Middle Body: Text Content / Tree -->
          <main class="detail-body" id="view_law_content">
            <!-- Rendered law text populates here -->
          </main>
        </div>

        <!-- Bottom Section: History & Metadata Footer -->
        <footer class="detail-footer">
          <h4 style="margin: 0 0 8px 0; color: var(--primary); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px;">
            HISTORY & METADATA
          </h4>
          <div class="detail-footer-content">
            <div>
              <strong>Revision History:</strong>
              <div id="view_law_history" style="margin-top: 2px; color: #4a5568;">--</div>
            </div>
            <div>
              <strong>Database Tracking:</strong>
              <div id="view_last_updated" style="margin-top: 2px; color: #4a5568;">--</div>
            </div>
          </div>
        </footer>

      </div>

    </div>

    <!-- RIGHT COLUMN: Associated Offenses -->
    <div class="card offenses-column">
      <h3 style="margin-top:0; font-size:1rem; color:#44337a;">Associated Offenses</h3>
      <div id="offensesPlaceholder" class="empty-msg">
        No law selected.
      </div>
      <ul class="offense-list" id="offensesContainer" style="display: none;">
        <!-- Dynamic offense items append here -->
      </ul>
    </div>

  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

let allLaws = [];
let currentSelectedId = null;

window.addEventListener('DOMContentLoaded', loadIndex);

async function loadIndex() {
  const container = document.getElementById('lawListContainer');
  const url = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws-index.json`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch index.');

    allLaws = await res.json();
    renderList(allLaws);
  } catch (err) {
    container.innerHTML = `<li class="empty-msg" style="color:#e53e3e;">Failed to load laws index.</li>`;
  }
}

function renderList(laws) {
  const container = document.getElementById('lawListContainer');
  container.innerHTML = '';

  if (laws.length === 0) {
    container.innerHTML = `<li class="empty-msg">No matching laws found.</li>`;
    return;
  }

  laws.forEach(law => {
    const li = document.createElement('li');
    li.className = `law-item ${law.id === currentSelectedId ? 'active' : ''}`;
    li.onclick = () => selectLaw(law.id, li);

    li.innerHTML = `
      <div class="law-item-title">${law.title || 'Untitled Record'}</div>
      <div class="law-item-id">ID: ${law.id}</div>
    `;

    container.appendChild(li);
  });
}

function filterLaws() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allLaws.filter(l => 
    (l.title && l.title.toLowerCase().includes(q)) || 
    (l.id && l.id.toLowerCase().includes(q))
  );
  renderList(filtered);
}

async function selectLaw(lawId, element) {
  currentSelectedId = lawId;

  document.querySelectorAll('.law-item').forEach(el => el.classList.remove('active'));
  if (element) element.classList.add('active');

  const placeholder = document.getElementById('detailPlaceholder');
  const content = document.getElementById('detailContent');

  placeholder.style.display = 'block';
  placeholder.textContent = 'Loading record details...';
  content.style.display = 'none';

  const fileUrl = `https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/data/laws/${lawId}.json`;

  try {
    const res = await fetch(fileUrl);
    if (!res.ok) throw new Error('Law record not found.');

    const lawData = await res.json();
    renderDetail(lawData);
    renderOffenses(lawData.offenses || []);

    placeholder.style.display = 'none';
    content.style.display = 'flex';
  } catch (err) {
    placeholder.textContent = `Error loading details: ${err.message}`;
    renderOffenses([]);
  }
}

function renderDetail(lawData) {
  // 1. Header Elements
  document.getElementById('view_source_type').textContent = lawData.source_type || 'MCA Statute';
  document.getElementById('view_law_title').textContent = lawData.title || 'Untitled Record';
  document.getElementById('view_law_id').innerHTML = `<strong>ID:</strong> ${lawData.law_id || lawData.id}`;

  const urlBtnContainer = document.getElementById('view_official_url_container');
  const urlLink = document.getElementById('view_official_url');

  if (lawData.official_url && lawData.official_url.trim() !== '') {
    urlLink.href = lawData.official_url;
    urlBtnContainer.style.display = 'block';
  } else {
    urlBtnContainer.style.display = 'none';
  }

  // 2. Middle Content Body
  const contentContainer = document.getElementById('view_law_content');
  if (lawData.tree && lawData.tree.length > 0) {
    contentContainer.innerHTML = renderTreeToHTML(lawData.tree);
  } else if (lawData.paragraphs && lawData.paragraphs.length > 0) {
    contentContainer.innerHTML = renderParagraphsToHTML(lawData.paragraphs);
  } else {
    contentContainer.innerHTML = '<p style="color: #a0aec0; font-style: italic;">No text content recorded for this entry.</p>';
  }

  // 3. Bottom Footer Metadata
  document.getElementById('view_law_history').textContent = lawData.history || 'No historical revision notes recorded.';

  if (lawData.last_updated) {
    const updatedDate = new Date(lawData.last_updated).toLocaleDateString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
    document.getElementById('view_last_updated').textContent = `Last Updated: ${updatedDate}`;
  } else {
    document.getElementById('view_last_updated').textContent = 'Last Updated: Unknown';
  }
}

function renderOffenses(offenses) {
  const container = document.getElementById('offensesContainer');
  const placeholder = document.getElementById('offensesPlaceholder');

  container.innerHTML = '';

  if (!offenses || offenses.length === 0) {
    placeholder.style.display = 'block';
    placeholder.textContent = 'No associated offenses recorded for this statute.';
    container.style.display = 'none';
    return;
  }

  placeholder.style.display = 'none';
  container.style.display = 'block';

  offenses.forEach(offense => {
    const li = document.createElement('li');
    li.className = 'offense-card';
    li.innerHTML = `
      <div class="offense-title">${offense.title || offense.name || 'Offense Entry'}</div>
      <div class="offense-severity">${offense.severity || offense.classification || 'Unclassified'}</div>
    `;
    container.appendChild(li);
  });
}

function renderTreeToHTML(nodes, level = 0) {
  let html = '<div>';
  nodes.forEach(node => {
    const indent = level * 16;
    html += `
      <div class="tree-node-view" style="margin-left: ${indent}px;">
        <strong>${node.counter || ''}</strong> ${node.text || ''}
        ${node.children && node.children.length > 0 ? renderTreeToHTML(node.children, level + 1) : ''}
      </div>
    `;
  });
  html += '</div>';
  return html;
}

function renderParagraphsToHTML(paragraphs) {
  return paragraphs.map(p => `
    <div style="margin-bottom: 8px; margin-left: ${(p.indent || 1) * 12}px;">
      <strong>${p.counter || ''}</strong> ${p.text || ''}
    </div>
  `).join('');
}
</script>

</body>
</html>
