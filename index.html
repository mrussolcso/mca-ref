<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montana Code Annotated & Bond Reference</title>
<style>
  :root { --primary: #1a365d; --border: #e2e8f0; --text: #2d3748; --accent-red: #9b2c2c; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: var(--text); }
  .container { max-width: 900px; margin: 0 auto; }
  
  /* Search Box */
  .search-box { width: 100%; padding: 14px 18px; font-size: 1.1rem; border: 2px solid var(--border); border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
  .search-box:focus { outline: none; border-color: var(--primary); }
  
  /* Cards & Grid Layout */
  .statute-card { background: #fff; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
  .statute-header { background: var(--primary); color: #fff; padding: 14px 20px; font-size: 1.15rem; font-weight: 700; }
  
  .bond-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #ebf8ff; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .bond-stat { display: flex; flex-direction: column; }
  .bond-stat .label { font-size: 0.72rem; text-transform: uppercase; color: #4a5568; font-weight: 600; }
  .bond-stat .value { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .bond-stat .value.must-appear { color: var(--accent-red); }

  /* Accordion Layout */
  details.statute-accordion { border-top: 1px solid var(--border); }
  summary.accordion-trigger { padding: 12px 20px; font-weight: 700; color: var(--primary); background: #f7fafc; cursor: pointer; user-select: none; }
  summary.accordion-trigger:hover { background: #edf2f7; }
  
  .statute-body { padding: 20px 24px; }
  .statute-list { list-style: none; padding-left: 0; margin: 0; }
  .statute-list li { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; margin-bottom: 8px; line-height: 1.5; }
  .counter { font-weight: 700; color: var(--primary); }
  
  .level-num { margin-left: 0px; }
  .level-alpha { margin-left: 20px; }
  .level-roman { margin-left: 40px; }
  
  .history-text { margin-top: 16px; font-size: 0.85rem; color: #718096; font-style: italic; }
</style>
</head>
<body>

<div class="container">
  <h2>Montana MCA & Bond Reference Search</h2>
  <input type="text" id="searchInput" class="search-box" placeholder="Search by Statute # (e.g. 45-5-206) or Keyword (e.g. assault)...">
  
  <div id="results">Loading database index...</div>
</div>

<script>
let searchIndex = [];
const loadedTitleFiles = {}; // Memory cache for fetched Title JSONs

// 1. Fetch lightweight search index on page open
fetch('search-index.json')
  .then(res => res.json())
  .then(data => {
    searchIndex = data;
    renderIndexResults(searchIndex);
  });

// 2. Real-time filtering logic
document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  const filtered = searchIndex.filter(item => 
    item.id.toLowerCase().includes(query) ||
    item.title.toLowerCase().includes(query) ||
    item.keywords.toLowerCase().includes(query)
  );
  renderIndexResults(filtered);
});

// 3. Render matching card shells
function renderIndexResults(items) {
  const container = document.getElementById('results');
  if (items.length === 0) {
    container.innerHTML = '<p>No statutes matched your search query.</p>';
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="statute-card" id="card-${item.id}">
      <div class="statute-header">${item.id} - ${item.title}</div>
      <div class="bond-info-grid">
        <div class="bond-stat"><span class="label">Offense Degree</span><span class="value">${item.degree}</span></div>
        <div class="bond-stat"><span class="label">Status</span><span class="value">Ready</span></div>
      </div>
      <details class="statute-accordion" ontoggle="loadFullStatute('${item.id}', ${item.title_num}, this)">
        <summary class="accordion-trigger">Click to Load Full Text</summary>
        <div class="statute-body" id="body-${item.id}">
          <em>Loading statutory text...</em>
        </div>
      </details>
    </div>
  `).join('');
}

// 4. On-demand fetching: Loads Title data file only when user expands accordion
async function loadFullStatute(statuteId, titleNum, detailsElement) {
  if (!detailsElement.open) return;
  const bodyElem = document.getElementById(`body-${statuteId}`);
  
  // Check memory cache first
  if (!loadedTitleFiles[titleNum]) {
    try {
      const res = await fetch(`data/titles/title_${titleNum}.json`);
      loadedTitleFiles[titleNum] = await res.json();
    } catch (e) {
      bodyElem.innerHTML = '<p style="color:red;">Error loading title data file.</p>';
      return;
    }
  }

  const titleData = loadedTitleFiles[titleNum];
  const statute = titleData.find(s => s.id === statuteId);

  if (statute) {
    const paragraphHTML = statute.paragraphs.map(p => {
      let levelClass = 'level-num';
      if (/^\([a-z]\)/.test(p.counter)) levelClass = 'level-alpha';
      else if (/^\([i|v|x]+\)/.test(p.counter)) levelClass = 'level-roman';
      return `<li class="${levelClass}"><span class="counter">${p.counter}</span><div>${p.text}</div></li>`;
    }).join('');

    bodyElem.innerHTML = `
      <ol class="statute-list">${paragraphHTML}</ol>
      <div class="history-text">${statute.history || ''}</div>
    `;
  } else {
    bodyElem.innerHTML = '<p>Statute detail text not found in data file.</p>';
  }
}
</script>

</body>
</html>
