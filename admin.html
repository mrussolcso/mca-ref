<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Law & Offense Publisher</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
    --card-bg: #ffffff;
    --text: #2d3748;
    --danger: #e53e3e;
    --success: #38a169;
  }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    margin: 0; 
    padding: 20px; 
  }

  .container { 
    max-width: 1200px; 
    margin: 0 auto; 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
  }
  
  .app-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: var(--primary); 
    color: white; 
    padding: 16px 20px; 
    border-radius: 8px; 
  }

  .app-header h1 { margin: 0; font-size: 1.3rem; }

  .btn-nav { 
    background: rgba(255, 255, 255, 0.2); 
    color: white; 
    text-decoration: none; 
    padding: 8px 14px; 
    border-radius: 6px; 
    font-weight: 600; 
    font-size: 0.9rem; 
  }

  .btn-nav:hover { background: rgba(255, 255, 255, 0.35); }

  .admin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .admin-grid { grid-template-columns: 1fr; }
  }

  .card { 
    background: var(--card-bg); 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    padding: 20px; 
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-weight: 600;
    font-size: 0.88rem;
    margin-bottom: 6px;
    color: var(--primary);
  }

  .form-control {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 0.9rem;
  }

  textarea.form-control {
    resize: vertical;
    min-height: 80px;
  }

  .btn-submit {
    background: var(--primary-light);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }

  .btn-submit:hover { background: var(--primary); }

  /* Dynamic Offense Rows */
  .offense-row {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }

  .btn-remove {
    background: #fed7d7;
    color: var(--danger);
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
    float: right;
  }

  /* Live Preview Pane */
  .preview-pane {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 450px;
  }

  .preview-header {
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  .badge-source {
    background: var(--primary-light);
    color: white;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    text-transform: uppercase;
  }

  .preview-body {
    flex-grow: 1;
    margin-bottom: 20px;
  }

  .preview-footer {
    border-top: 1px solid var(--border);
    background: #f8fafc;
    border-radius: 6px;
    padding: 12px;
    font-size: 0.82rem;
    color: #718096;
  }

  .status-alert {
    padding: 12px;
    border-radius: 6px;
    font-size: 0.88rem;
    display: none;
    margin-top: 10px;
  }

  .status-alert.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
  .status-alert.error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
</style>
</head>
<body>

<div class="container">
  
  <header class="app-header">
    <h1>⚙️ Law & Offense Publisher</h1>
    <a href="index.html" class="btn-nav">📖 Return to Directory</a>
  </header>

  <div class="admin-grid">
    
    <!-- LEFT COLUMN: Entry Form -->
    <div class="card">
      <h3 style="margin-top:0; color:var(--primary);">Law & Offense Data Form</h3>
      
      <!-- PAT Token Field with Eye Toggle -->
      <div class="form-group">
        <label for="patToken">GitHub Personal Access Token (PAT):</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input 
            type="password" 
            id="patToken" 
            class="form-control" 
            placeholder="ghp_..." 
            style="padding-right: 40px;"
          >
          <button 
            type="button" 
            id="togglePatVisibility" 
            onclick="togglePatTokenView()" 
            title="Toggle Visibility"
            style="
              position: absolute; 
              right: 8px; 
              background: transparent; 
              border: none; 
              cursor: pointer; 
              font-size: 1.1rem; 
              padding: 4px;
              line-height: 1;
              color: #718096;
            "
          >
            👁️
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="law_id">Law ID / Section Number:</label>
        <input type="text" id="law_id" class="form-control" placeholder="e.g., 45-5-206" oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label for="source_type">Source Type:</label>
        <input type="text" id="source_type" class="form-control" value="MCA Statute" oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label for="title">Title / Name:</label>
        <input type="text" id="title" class="form-control" placeholder="e.g., Partner or Family Member Assault" oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label for="official_url">Official Publication URL:</label>
        <input type="url" id="official_url" class="form-control" placeholder="https://leg.mt.gov/..." oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label for="law_content">Statute Content / Text:</label>
        <textarea id="law_content" class="form-control" rows="5" placeholder="Enter full text of the law here..." oninput="updatePreview()"></textarea>
      </div>

      <div class="form-group">
        <label for="history">Revision History / Historical Notes:</label>
        <textarea id="history" class="form-control" rows="3" placeholder="En. Sec. 1, Ch. 700, L. 1985..." oninput="updatePreview()"></textarea>
      </div>

      <!-- Associated Offenses Container -->
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label style="margin: 0;">Associated Offenses:</label>
          <button type="button" onclick="addOffenseRow()" style="background:#e2e8f0; border:none; padding:4px 8px; border-radius:4px; font-weight:600; cursor:pointer;">+ Add Offense</button>
        </div>
        <div id="offensesList"></div>
      </div>

      <button type="button" class="btn-submit" onclick="publishRecord()">🚀 Publish & Sync to GitHub</button>
      <div id="statusAlert" class="status-alert"></div>
    </div>

    <!-- RIGHT COLUMN: Live Entry Preview -->
    <div class="card preview-pane">
      <div>
        <h3 style="margin-top:0; color:#718096; font-size:0.9rem; text-transform:uppercase;">Live Form Preview</h3>
        
        <header class="preview-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
            <div>
              <span class="badge-source" id="prev_source_type">MCA Statute</span>
              <h2 id="prev_title" style="margin: 8px 0 4px 0; color: var(--primary);">Untitled Record</h2>
              <div style="font-size: 0.88rem; color: #4a5568;" id="prev_law_id"><strong>ID:</strong> --</div>
            </div>
            <div id="prev_url_container" style="display:none;">
              <a id="prev_official_url" href="#" target="_blank" style="background:var(--primary-light); color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:0.8rem; font-weight:bold;">
                🔗 Official Link
              </a>
            </div>
          </div>
        </header>

        <main class="preview-body" id="prev_content">
          <p style="color: #a0aec0; font-style: italic;">Text preview will appear here as you type...</p>
        </main>
      </div>

      <!-- Bottom History and Metadata Footer -->
      <footer class="preview-footer">
        <h4 style="margin: 0 0 8px 0; color: var(--primary); font-size: 0.82rem; text-transform: uppercase;">
          HISTORY & METADATA
        </h4>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <strong>Revision History:</strong>
            <div id="prev_history" style="margin-top: 2px; color: #4a5568;">--</div>
          </div>
          <div>
            <strong>Database Tracking:</strong>
            <div id="prev_updated" style="margin-top: 2px; color: #4a5568;">Last Updated: Pending Publish</div>
          </div>
        </div>
      </footer>

    </div>

  </div>

</div>

<script>
const REPO_CONFIG = {
  owner: 'mrussolcso',
  repo: 'mca-ref',
  branch: 'main'
};

// Toggle PAT Token Field Visibility
function togglePatTokenView() {
  const tokenInput = document.getElementById('patToken');
  const toggleBtn = document.getElementById('togglePatVisibility');

  if (tokenInput.type === 'password') {
    tokenInput.type = 'text';
    toggleBtn.textContent = '🙈';
  } else {
    tokenInput.type = 'password';
    toggleBtn.textContent = '👁️';
  }
}

// Dynamic Offense Sub-Form Rows
function addOffenseRow(offenseData = {}) {
  const container = document.getElementById('offensesList');
  const div = document.createElement('div');
  div.className = 'offense-row';
  
  div.innerHTML = `
    <button type="button" class="btn-remove" onclick="this.parentElement.remove(); updatePreview();">Remove</button>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:4px;">
      <input type="text" class="form-control off-title" placeholder="Offense Title" value="${offenseData.title || ''}" oninput="updatePreview()">
      <input type="text" class="form-control off-severity" placeholder="Severity / Penalty" value="${offenseData.severity || ''}" oninput="updatePreview()">
    </div>
  `;
  container.appendChild(div);
  updatePreview();
}

// Live Preview Update Logic
function updatePreview() {
  const lawId = document.getElementById('law_id').value || '--';
  const sourceType = document.getElementById('source_type').value || 'MCA Statute';
  const title = document.getElementById('title').value || 'Untitled Record';
  const officialUrl = document.getElementById('official_url').value;
  const content = document.getElementById('law_content').value;
  const history = document.getElementById('history').value;

  document.getElementById('prev_law_id').innerHTML = `<strong>ID:</strong> ${lawId}`;
  document.getElementById('prev_source_type').textContent = sourceType;
  document.getElementById('prev_title').textContent = title;

  const urlContainer = document.getElementById('prev_url_container');
  if (officialUrl) {
    document.getElementById('prev_official_url').href = officialUrl;
    urlContainer.style.display = 'block';
  } else {
    urlContainer.style.display = 'none';
  }

  document.getElementById('prev_content').innerHTML = content 
    ? content.replace(/\n/g, '<br>') 
    : '<p style="color: #a0aec0; font-style: italic;">Text preview will appear here as you type...</p>';

  document.getElementById('prev_history').textContent = history || '--';
}

// Get Collected Offenses
function getCollectedOffenses() {
  const rows = document.querySelectorAll('.offense-row');
  const offenses = [];
  rows.forEach(row => {
    const title = row.querySelector('.off-title').value;
    const severity = row.querySelector('.off-severity').value;
    if (title || severity) {
      offenses.push({ title, severity });
    }
  });
  return offenses;
}

// GitHub API Direct Committer
async function publishRecord() {
  const token = document.getElementById('patToken').value.trim();
  const alertBox = document.getElementById('statusAlert');

  if (!token) {
    showAlert('Please enter your GitHub Personal Access Token.', 'error');
    return;
  }

  const lawId = document.getElementById('law_id').value.trim();
  if (!lawId) {
    showAlert('Please provide a Law ID.', 'error');
    return;
  }

  showAlert('Syncing with GitHub...', 'success');

  const nowIso = new Date().toISOString();
  const lawPayload = {
    id: lawId,
    law_id: lawId,
    source_type: document.getElementById('source_type').value,
    title: document.getElementById('title').value,
    official_url: document.getElementById('official_url').value,
    history: document.getElementById('history').value,
    last_updated: nowIso,
    paragraphs: [{ counter: "", text: document.getElementById('law_content').value }],
    offenses: getCollectedOffenses()
  };

  const filePath = `data/laws/${lawId}.json`;
  const githubApiUrl = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${filePath}`;

  try {
    // 1. Check for existing file SHA
    let existingSha = null;
    const getRes = await fetch(githubApiUrl, {
      headers: { Authorization: `token ${token}` }
    });
    if (getRes.ok) {
      const existingData = await getRes.json();
      existingSha = existingData.sha;
    }

    // 2. Commit law JSON file
    const commitBody = {
      message: `Update law record ${lawId}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(lawPayload, null, 2)))),
      branch: REPO_CONFIG.branch
    };
    if (existingSha) commitBody.sha = existingSha;

    const putRes = await fetch(githubApiUrl, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(commitBody)
    });

    if (!putRes.ok) throw new Error('Failed to commit record file to GitHub.');

    // 3. Update main index JSON
    await updateIndexFile(token, { id: lawId, title: lawPayload.title });

    showAlert(`Successfully published record ${lawId}!`, 'success');
  } catch (err) {
    showAlert(`Error publishing: ${err.message}`, 'error');
  }
}

async function updateIndexFile(token, newEntry) {
  const indexPath = `data/laws-index.json`;
  const indexUrl = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${indexPath}`;

  let indexList = [];
  let sha = null;

  const res = await fetch(indexUrl, { headers: { Authorization: `token ${token}` } });
  if (res.ok) {
    const data = await res.json();
    sha = data.sha;
    indexList = JSON.parse(decodeURIComponent(escape(atob(data.content))));
  }

  // Update or append
  const idx = indexList.findIndex(item => item.id === newEntry.id);
  if (idx >= 0) {
    indexList[idx] = newEntry;
  } else {
    indexList.push(newEntry);
  }

  await fetch(indexUrl, {
    method: 'PUT',
    headers: {
      Authorization: `token ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: `Update directory index for ${newEntry.id}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(indexList, null, 2)))),
      sha: sha,
      branch: REPO_CONFIG.branch
    })
  });
}

function showAlert(msg, type) {
  const alertBox = document.getElementById('statusAlert');
  alertBox.className = `status-alert ${type}`;
  alertBox.textContent = msg;
  alertBox.style.display = 'block';
}
</script>

</body>
</html>
