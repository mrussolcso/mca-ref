<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montana Code Annotated & Bond Schedule Reference</title>
<style>
  :root { 
    --primary: #1a365d; 
    --primary-light: #2b6cb0; 
    --border: #cbd5e0; 
    --bg: #f7fafc; 
    --danger: #e53e3e; 
    --highlight: #fefcbf;
    --highlight-border: #ecc94b;
  }
  
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
  .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  
  /* Header Nav */
  .app-header { display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; padding: 16px 20px; border-radius: 8px; }
  .app-header h1 { margin: 0; font-size: 1.4rem; }
  .btn-admin { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
  .btn-admin:hover { background: rgba(255, 255, 255, 0.35); }

  /* Top Control Card */
  .card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .controls-grid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
  input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }

  /* 3-Column Layout */
  .view-grid-3col { 
    display: grid; 
    grid-template-columns: 320px 1fr 300px; 
    gap: 20px; 
    align-items: start;
  }

  /* Structural Panels (Natural scrolling, no fixed heights) */
  .list-panel, .center-panel, .related-panel { 
    background: white; 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    padding: 20px; 
    box-sizing: border-box;
  }

  /* Shared Interactive Item Cards */
  .list-item { padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .list-item:hover { background: #edf2f7; }
  .list-item.active { background: #ebf8ff; border-color: var(--primary-light); }
  .item-tag { font-weight: bold; color: var(--primary); font-size: 0.92rem; word-break: break-word; }
  .item-sub { font-size: 0.82rem; color: #4a5568; margin-top: 3px; }

  /* Center Column: Offense Details Box */
  .offense-details-box { 
    background: #f7fafc; 
    border: 1px solid var(--border); 
    border-radius: 6px; 
    padding: 18px; 
    margin-bottom: 24px; 
  }
  .offense-details-box h2 { 
    margin: 0 0 14px 0; 
    font-size: 1.25rem; 
    color: var(--primary); 
    border-bottom: 2px solid var(--border); 
    padding-bottom: 8px; 
    word-break: break-word;
  }
  .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px; font-size: 0.88rem; }
  .meta-item { overflow-wrap: anywhere; word-break: break-word; }
  .meta-item strong { color: var(--primary); }

  /* Law Text Display */
  .law-header { border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; }
  .law-header h3 { margin: 0; color: var(--primary); font-size: 1.15rem; }
  .law-body { margin-top: 12px; line-height: 1.6; color: #2d3748; }
  .law-paragraph { padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; transition: background 0.2s; }
  .law-paragraph.highlighted { background-color: var(--highlight); border-left: 4px solid var(--highlight-border); padding-left: 10px; font-weight: 500; }

  .indent-1 { margin-left: 0px; }
  .indent-2 { margin-left: 20px; }
  .indent-3 { margin-left: 40px; }
  .indent-4 { margin-left: 60px; }

  /* Right Column: Related Offenses */
  .related-panel h3 { margin: 0 0 12px 0; font-size: 1.05rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  .empty-state { text-align: center; color: #a0aec0; margin: 60px 0; font-style: italic; }
</style>
</head>
<body>

<div class="container">

  <!-- Application Header -->
  <header class="app-header">
    <h1>🏛️ Montana Law & Bond Schedule Reference</h1>
    <a href="admin.html" class="btn-admin">⚙️ Admin Publisher</a>
  </header>

  <!-- Control Controls -->
  <div class="card">
    <div class="controls-grid">
      <div>
        <label for="modeSelect">Browse Mode</label>
        <select id="modeSelect" onchange="switchMode(this.value)">
          <option value="offense">🚨 Offenses / Bond Book</option>
          <option value="law">📜 MCA Laws & Statutes</option>
        </select>
      </div>
      <div>
        <label for="searchInput">Search Filter</label>
        <input type="text" id="searchInput" placeholder="Search by title, charge code, section number, or keyword..." oninput="filterList()">
      </div>
    </div>
  </div>

  <!-- 3-Column Layout -->
  <div class="view-grid-3col">
    
    <!-- Column 1: Main Offense/Law Index List -->
    <div class="list-panel" id="listContainer">
      <div class="empty-state">Loading index data...</div>
    </div>

    <!-- Column 2: Offense Details Box + Law Statute Text -->
    <div class="center-panel" id="centerContainer">
      <div class="empty-state">Select an item from the left panel to view details.</div>
    </div>

    <!-- Column 3: Related Offenses Box -->
    <div class="related-panel" id="relatedContainer">
      <div class="empty-state">No related offenses to show.</div>
    </div>

  </div>

</div>

<script>
let offensesIndex = [];
let lawsIndex = [];
let currentMode = 'offense';
let activeItemId = null;

window.addEventListener('DOMContentLoaded', async () => {
  await loadIndexes();
  renderList();
});

async function loadIndexes() {
  try {
    const [offRes, lawRes] = await Promise.all([
      fetch('data/offenses-index.json').catch(() => null),
      fetch('data/laws-index.json').catch(() => null)
    ]);

    if (offRes && offRes.ok) offensesIndex = await offRes.json();
    if (lawRes && lawRes.ok) lawsIndex = await lawRes.json();
  } catch (err) {
    console.error('Error loading index files:', err);
  }
}

function switchMode(mode) {
  currentMode = mode;
  activeItemId = null;
  document.getElementById('centerContainer').innerHTML = '<div class="empty-state">Select an item from the left panel to view details.</div>';
  document.getElementById('relatedContainer').innerHTML = '<div class="empty-state">No related offenses to show.</div>';
  renderList();
}

function filterList() {
  renderList();
}

function renderList() {
  const container = document.getElementById('listContainer');
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  container.innerHTML = '';

  const indexData = currentMode === 'offense' ? offensesIndex : lawsIndex;

  const filtered = indexData.filter(item => {
    if (!query) return true;
    if (currentMode === 'offense') {
      return (item.name || '').toLowerCase().includes(query) || 
             (item.id || '').toLowerCase().includes(query) || 
             (item.display_tag || '').toLowerCase().includes(query) ||
             (item.law_id || '').toLowerCase().includes(query);
    } else {
      return (item.title || '').toLowerCase().includes(query) || 
             (item.id || '').toLowerCase().includes(query);
    }
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">No matching records found.</div>';
    return;
  }

  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = `list-item ${item.id === activeItemId ? 'active' : ''}`;
    
    if (currentMode === 'offense') {
      const tagDisplay = item.display_tag || item.id;
      div.innerHTML = `
        <div class="item-tag">${tagDisplay}</div>
        <div class="item-sub">${item.name || 'Unnamed Offense'}</div>
      `;
      div.onclick = () => loadOffenseDetail(item.id);
    } else {
      div.innerHTML = `
        <div class="item-tag">${item.id}</div>
        <div class="item-sub">${item.title || 'Untitled Law'}</div>
      `;
      div.onclick = () => loadLawDetail(item.id);
    }

    container.appendChild(div);
  });
}

function formatBondValue(offense) {
  if (offense.bond_type === 'no_bond') return 'No Bond (Hold Until Appearance)';
  if (offense.bond_type === 'schedule') return 'Discretionary / Per Bond Schedule';
  if (offense.bond_amount !== null && offense.bond_amount !== undefined) {
    return `$${Number(offense.bond_amount).toLocaleString()}`;
  }
  return 'N/A';
}

function formatOccurrence(occ) {
  if (!occ) return 'Standard / First Instance';
  const s = ["th", "st", "nd", "rd"];
  const v = occ % 100;
  const suffix = s[(v - 20) % 10] || s[v] || s[0];
  return `${occ}${suffix} Offense`;
}

async function loadOffenseDetail(offenseId) {
  activeItemId = offenseId;
  renderList();

  const centerContainer = document.getElementById('centerContainer');
  const relatedContainer = document.getElementById('relatedContainer');

  centerContainer.innerHTML = '<div class="empty-state">Loading offense and statute data...</div>';
  relatedContainer.innerHTML = '<div class="empty-state">Finding related offenses...</div>';

  try {
    const offRes = await fetch(`data/offenses/${offenseId}.json`);
    if (!offRes.ok) throw new Error('Offense record not found.');
    const offense = await offRes.json();

    let lawData = null;
    if (offense.law_id) {
      const lawRes = await fetch(`data/laws/${offense.law_id}.json`).catch(() => null);
      if (lawRes && lawRes.ok) lawData = await lawRes.json();
    }

    // Method 1 Header Logic: Display clean display_tag (e.g., 45-5-206(1)(a) [1st]) + Name
    const chargeTag = offense.display_tag || (offense.law_id ? `${offense.law_id} [${formatOccurrence(offense.occurrence)}]` : offense.offense_id);
    const offenseTitle = offense.name || 'Offense Record';
    const headerDisplay = `${chargeTag} ${offenseTitle}`;

    // Center Pane HTML
    let centerHtml = `
      <div class="offense-details-box">
        <h2>${headerDisplay}</h2>
        <div class="meta-grid">
          <div class="meta-item"><strong>Occurrence / Sequence:</strong> ${formatOccurrence(offense.occurrence)}</div>
          <div class="meta-item"><strong>Severity:</strong> ${offense.severity || 'Unspecified'}</div>
          <div class="meta-item"><strong>Bond Amount:</strong> ${formatBondValue(offense)}</div>
          <div class="meta-item"><strong>Mandatory Appearance:</strong> ${offense.mandatory_appearance ? 'Yes' : 'No'}</div>
          <div class="meta-item" style="grid-column: span 2;"><strong>Associated Law ID:</strong> ${offense.law_id || 'None'}</div>
          ${offense.conditions ? `<div class="meta-item" style="grid-column: span 2;"><strong>Special Conditions:</strong> ${offense.conditions}</div>` : ''}
          ${offense.description ? `<div class="meta-item" style="grid-column: span 2; margin-top: 4px;"><strong>Charge Overview:</strong> ${offense.description}</div>` : ''}
        </div>
      </div>
    `;

    if (lawData) {
      centerHtml += `
        <div class="law-header">
          <h3>Statute Text: ${lawData.law_id} - ${lawData.title}</h3>
          ${lawData.official_url ? `<a href="${lawData.official_url}" target="_blank" style="font-size:0.85rem; color:var(--primary-light);">Official Publication 🔗</a>` : ''}
        </div>
        <div class="law-body">
      `;

      // Highlights are strictly driven by target_anchors array
      const targetAnchors = (offense.target_anchors || []).map(a => a.toLowerCase().trim());

      (lawData.paragraphs || []).forEach(p => {
        const isHighlighted = targetAnchors.includes((p.anchor_id || '').toLowerCase());
        const indentClass = `indent-${Math.min(p.indent || 1, 4)}`;
        const highlightClass = isHighlighted ? 'highlighted' : '';

        centerHtml += `
          <div class="law-paragraph ${indentClass} ${highlightClass}" id="anchor-${p.anchor_id}">
            <strong>${p.counter}</strong> ${p.text}
          </div>
        `;
      });

      centerHtml += `</div>`;
    } else if (offense.law_id) {
      centerHtml += `<div style="color: #718096; font-style: italic;">Associated statute text (${offense.law_id}) could not be retrieved.</div>`;
    }

    centerContainer.innerHTML = centerHtml;

    // Render Right Pane
    renderRelatedOffenses(offense.law_id, offense.offense_id);

  } catch (err) {
    centerContainer.innerHTML = `<div class="empty-state" style="color: var(--danger);">Error: ${err.message}</div>`;
    relatedContainer.innerHTML = `<div class="empty-state">Unable to load related items.</div>`;
  }
}

function renderRelatedOffenses(lawId, currentOffenseId) {
  const container = document.getElementById('relatedContainer');
  if (!lawId) {
    container.innerHTML = '<div class="empty-state">No linked law ID to find related charges.</div>';
    return;
  }

  const related = offensesIndex.filter(o => o.law_id === lawId && o.id !== currentOffenseId);

  let html = `<h3>Related Charges (${lawId})</h3>`;

  if (related.length === 0) {
    html += '<div style="color: #a0aec0; font-style: italic; font-size: 0.88rem;">No other charges linked to this statute.</div>';
  } else {
    related.forEach(rel => {
      const tagDisplay = rel.display_tag || rel.id;
      html += `
        <div class="list-item" onclick="loadOffenseDetail('${rel.id}')">
          <div class="item-tag">${tagDisplay}</div>
          <div class="item-sub">${rel.name || 'Unnamed Offense'}</div>
        </div>
      `;
    });
  }

  container.innerHTML = html;
}

async function loadLawDetail(lawId) {
  activeItemId = lawId;
  renderList();

  const centerContainer = document.getElementById('centerContainer');
  const relatedContainer = document.getElementById('relatedContainer');

  centerContainer.innerHTML = '<div class="empty-state">Loading statute text...</div>';

  try {
    const res = await fetch(`data/laws/${lawId}.json`);
    if (!res.ok) throw new Error('Law record not found.');
    const law = await res.json();

    let html = `
      <div class="law-header">
        <h2>${law.law_id} - ${law.title}</h2>
        ${law.official_url ? `<a href="${law.official_url}" target="_blank" style="font-size:0.85rem; color:var(--primary-light);">View Official Publication 🔗</a>` : ''}
      </div>
      <div class="law-body">
    `;

    (law.paragraphs || []).forEach(p => {
      const indentClass = `indent-${Math.min(p.indent || 1, 4)}`;
      html += `
        <div class="law-paragraph ${indentClass}" id="anchor-${p.anchor_id}">
          <strong>${p.counter}</strong> ${p.text}
        </div>
      `;
    });

    html += `</div>`;
    centerContainer.innerHTML = html;

    renderRelatedOffenses(lawId, null);

  } catch (err) {
    centerContainer.innerHTML = `<div class="empty-state" style="color: var(--danger);">Error: ${err.message}</div>`;
  }
}
</script>

</body>
</html>
